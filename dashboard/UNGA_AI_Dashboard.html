ense rivalry in space, cybertechnology and artificial intelligence.","at":"page 23, paragraph 5","th":["Geopolitical competition and AI race"]}],"2019_LVA":[{"e":"E00027","q":"We must not allow artificial intelligence rather than humans to take legally binding decisions. Humans must retain control.","at":"page 20, paragraph 9","th":["Human agency, control and accountability","Human rights, ethics and democracy"]},{"e":"E00028","q":"The United Nations must therefore actively promote the discussion of personal data protection in cyberspace, especially the ethical and legal standards for the collection and use of personal data.","at":"page 20, paragraph 10","th":[]}],"2019_MCO":[{"e":"E00029","q":"Artificial intelligence brings hope, but also poses risks that must be comprehensively addressed.","at":"page 10, paragraph 13","th":["AI as both promise and peril","AI as epochal transformation"]}],"2019_PRT":[{"e":"E00030","q":"including by defending effective multilateralism, based on international law and the Charter of the United Nations, and its legal extension to new global realities, such as the oceans, combating terrorism and artificial intelligence.","at":"page 3, paragraph 3","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2019_RUS":[{"e":"E00031","q":"One of the most crucial tasks of the international community is developing generally acceptable approaches to regulating the digital arena and understanding the processes related to the development of artificial intelligence.","at":"page 51, paragraph 21","th":["International AI rules and governance"]}],"2019_SVK":[{"e":"E00032","q":"Secondly, we have serious difficulties in agreeing on new rules. Often, we cannot agree at all. That applies to new areas that have emerged as a result of our successes and progress. Those mostly concern climate change but also new technologies, cybernetics or artificial intelligence.","at":"page 22, paragraph 3","th":["International AI rules and governance"]}],"2019_SVN":[{"e":"E00033","q":"According to estimates, as much as 80 per cent of future work will be done using artificial intelligence.","at":"page 15, paragraph 19","th":["Jobs, labour and economic transformation","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00034","q":"We need to be better prepared for the challenge of algocracy, including by regulating the impact of artificial intelligence on human rights protection.","at":"page 15, paragraph 20","th":["UN bodies and processes on AI","Human rights, ethics and democracy","National AI strategy and achievements"]},{"e":"E00035","q":"The aim of the centre will be to provide an open environment, focusing on the governance and policies surrounding artificial intelligence.","at":"page 15, paragraph 21","th":["UN bodies and processes on AI","National AI strategy and achievements"]}],"2019_TUR":[{"e":"E00036","q":"It is painful to see that, while a fortunate minority in the world is discussing such issues as digital technology, robotics, artificial intelligence and obesity, more than 2 billion people are living under the poverty line and 1 billion people are suffering from hunger.","at":"page 19, paragraph 8","th":[]}],"2019_URY":[{"e":"E00037","q":"Rapid technological advances in artificial intelligence are transforming societies by changing the way people learn, work and live together. Education systems could use artificial intelligence to change their management, teaching and learning.","at":"page 11, paragraph 32","th":["Youth, education and skills","AI as epochal transformation"]}],"2020_BRA":[{"e":"E00038","q":"Brazil is thus open for the development of state-of-the-art technology and innovation efforts, such as 4.0 Industry, artificial intelligence, nanotechnology and 5G technology, with all partners who respect our sovereignty and cherish freedom and data protection.","at":"page 12, paragraph 17","th":["AI listed among technologies"]}],"2020_CZE":[{"e":"E00039","q":"a clash between personal freedoms and technological surveillance, including the tendency for a faster introduction of artificial intelligence into the health sector.","at":"page 39, paragraph 14","th":["Human rights, ethics and democracy"]}],"2020_ESP":[{"e":"E00040","q":"Artificial intelligence applied to big data and the internet of things facilitate more efficient logistics and transportation, emissions reduction, less aggressive mining and agriculture, the use of renewable energy, and a more circular economy.","at":"page 79, paragraph 21","th":["AI for development and the SDGs"]}],"2020_FRA":[{"e":"E00041","q":"the Global Partnership on Artificial Intelligence.","at":"page 79, paragraph 31","th":["International AI rules and governance"]},{"e":"E00042","q":"each of these partnerships and make progress on the Aqaba Process.","at":"page 80, paragraph 32","th":[]},{"e":"E00043","q":"But it is clear that global value chains need to be rethought today because the crisis has shown that dependence on such strategic sectors as health, digital technology, artificial intelligence as well as food can call into question the free exercise of sovereignty in the world as it is.","at":"page 81, paragraph 40","th":["Power concentration, dependence and sovereignty"]}],"2020_PRT":[{"e":"E00044","q":"From artificial intelligence and robotization to the implementation of smart grids and 5G infrastructure and data management, to restructuring entire sectors of the economy, the impact of new technologies — on the economy, the work world and relations among States — will demand new rules of conduct at the international level.","at":"page 13, paragraph 9","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2020_ROU":[{"e":"E00045","q":"The development and use of Digital technologies, including Artificial Intelligence, based on ethical principles, must be human-centred.","at":"page 31, paragraph 27","th":["Human rights, ethics and democracy"]}],"2020_RUS":[{"e":"E00046","q":"Artificial intelligence has assisted doctors in making more accurate and timely diagnoses and finding the best treatment.","at":"page 49, paragraph 19","th":["AI for development and the SDGs"]},{"e":"E00047","q":"seek for a right balance between encouraging the development of artificial intelligence and justifiable restrictions to limit it","at":"page 49, paragraph 22","th":["International AI rules and governance"]}],"2020_SGP":[{"e":"E00048","q":"COVID-19 has accelerated the deployment of artificial intelligence, robotics, digital payments, e-government services, and remote work.","at":"page 48, paragraph 24","th":["AI listed among technologies"]}],"2020_SVN":[{"e":"E00049","q":"New technologies and artificial intelligence have already become the backbone of our daily lives that keep businesses and essential public services running.","at":"page 21, paragraph 12","th":["AI as epochal transformation"]},{"e":"E00050","q":"We need to frame them in service of humankind. Slovenia makes an effort in this direction with the very first UNESCO global center for artificial intelligence established in Ljubljana last November.","at":"page 21, paragraph 13","th":["UN bodies and processes on AI","National AI strategy and achievements"]}],"2021_AUT":[{"e":"E00051","q":"New and emerging technologies like artificial intelligence and quantum computing are racing ahead, leaving many of us behind.","at":"page 21, paragraph 19","th":["AI as epochal transformation"]},{"e":"E00052","q":"This includes stepping back from creating killing machines — lethal autonomous weapons systems — where an algorithm decides in a split second who lives and who dies.","at":"page 21, paragraph 20","th":["Military AI and autonomous weapons","Human rights, ethics and democracy"]}],"2021_COL":[{"e":"E00053","q":"While this fateful virus has threatened our economies and our education and health systems, technology — the Internet of Things, artificial intelligence, cybersecurity, cloud computing and other applications — has revealed that advances in the virtual world are opportunities for human development.","at":"page 18, paragraph 3","th":["AI listed among technologies"]}],"2021_CZE":[{"e":"E00054","q":"We must all work together to ensure that new digital technologies, including artificial intelligence, remain an enabler of human progress, rather than a tool for surveillance, oppression and control.","at":"page 18, paragraph 12","th":["Human rights, ethics and democracy"]}],"2021_GBR":[{"e":"E00055","q":"using artificial intelligence and robotics to enhance food production, capture carbon dioxide and put it into brownies and so on.","at":"page 13, paragraph 32","th":["AI for development and the SDGs"]}],"2021_LVA":[{"e":"E00056","q":"digital transformation and artificial intelligence pose new risks.","at":"page 25, paragraph 8","th":["International AI rules and governance","Human rights, ethics and democracy","AI as both promise and peril"]},{"e":"E00057","q":"The main challenge for the democratic world in the coming decades will be whether artificial intelligence or humans control decisions.","at":"page 25, paragraph 9","th":["Human agency, control and accountability","Human rights, ethics and democracy","Disinformation and information integrity"]},{"e":"E00058","q":"Looking ahead, I consider protecting the autonomy of human thought to be the most important task for legal policy in the coming decades.","at":"page 25, paragraph 12","th":[]},{"e":"E00059","q":"Latvian digital technology companies are developing a high-quality machine translation programme for small languages using artificial intelligence.","at":"page 25, paragraph 13","th":["Bias, stereotypes and cultural diversity","National AI strategy and achievements"]}],"2021_SVN":[{"e":"E00060","q":"the International Research Centre on Artificial Intelligence, in Ljubljana, the capital of Slovenia, in March 2021.","at":"page 14, paragraph 11","th":["UN bodies and processes on AI","National AI strategy and achievements"]}],"2021_USA":[{"e":"E00061","q":"As new technologies continue to evolve, we will work together with our democratic partners to ensure that new advances in areas from biotechnology to quantum computing, to 5G, to artificial intelligence and more are used to lift people up, solve problems and advance human freedom, not to suppress dissent or target minority communities.","at":"page 12, paragraph 32","th":["Human rights, ethics and democracy","AI as both promise and peril"]}],"2022_BHR":[{"e":"E00062","q":"with support for the digital economy and artificial-intelligence technologies","at":"page 42, paragraph 20","th":["AI listed among technologies"]}],"2022_GBR":[{"e":"E00063","q":"A country where artificial intelligence acts as","at":"page 46, paragraph 5","th":[]},{"e":"E00064","q":"judge and jury and where there are no human rights and no fundamental freedoms","at":"page 47, paragraph 6","th":[]}],"2022_LKA":[{"e":"E00065","q":"The absence of a regulatory supervisory regime concerning the use of new technologies in cyberspace and in artificial intelligence needs to be addressed urgently. Their ability to cause large-scale disruption, spread disinformation and undermine scientifically established findings is of real concern and a danger we all face.","at":"page 20, paragraph 26","th":["International AI rules and governance","Disinformation and information integrity","Cyber threats, crime and terrorist misuse"]}],"2022_MCO":[{"e":"E00066","q":"Artificial intelligence must serve humans and not manipulate their behaviour and thoughts.","at":"page 23, paragraph 22","th":["Human rights, ethics and democracy"]}],"2022_PHL":[{"e":"E00067","q":"forming legal rules that will prevent the weaponization of artificial intelligence.","at":"page 6, paragraph 30","th":["Military AI and autonomous weapons"]}],"2022_RWA":[{"e":"E00068","q":"To ensure that the benefits are equally shared, we must continue to invest equitably in emerging technologies, such as artificial intelligence.","at":"page 13, paragraph 9","th":["AI divide and equitable access"]}],"2023_ARG":[{"e":"E00069","q":"Robotization and the accelerated process of installation of artificial intelligence force us to rethink education, production processes and the preservation of work.","at":"page 15, paragraph 2","th":["Jobs, labour and economic transformation","AI as epochal transformation"]}],"2023_ATG":[{"e":"E00070","q":"Let us consider a drone, meticulously programmed with facial recognition technology, set to target an individual. It scans, identifies and eliminates its target, all while operating undetected.","at":"page 48, paragraph 31","th":["UN bodies and processes on AI","Military AI and autonomous weapons","Cyber threats, crime and terrorist misuse"]}],"2023_AUT":[{"e":"E00071","q":"who want us to believe that we can solve problems by simply negating them, by pulling up the drawbridge and decoupling from reality, be it on climate change, disruptive technologies like artificial intelligence, mutual political and economic dependencies or the growing multipolarity in geopolitics.","at":"page 37, paragraph 4","th":["AI listed among threats or crises"]}],"2023_BGR":[{"e":"E00072","q":"Our digital future and artificial intelligence should be guided by a humancentred approach based on human rights, democracy and the rule of law.","at":"page 28, paragraph 17","th":["UN bodies and processes on AI","Human rights, ethics and democracy"]}],"2023_BRB":[{"e":"E00073","q":"The role that artificial intelligence (AI) and generative artificial intelligence will play in our world must be for good purposes and not evil, but if we are to ensure that is the case, then an appropriate framework for regulatory action must be put in place.","at":"page 22, paragraph 6","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy"]}],"2023_CAN":[{"e":"E00074","q":"They are also concerned about artificial intelligence, foreign interference, misinformation and disinformation.","at":"page 35, paragraph 8","th":["AI listed among threats or crises"]}],"2023_CHL":[{"e":"E00075","q":"In that context, we are all obliged to create multilateral consensus and an ethical framework for the development and use of new technologies, such as artificial intelligence.","at":"page 20, paragraph 23","th":["International AI rules and governance","Human rights, ethics and democracy","Protecting children from AI harms","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00076","q":"with a view to protecting and promoting the dignity and the rights of peoples and individuals, as well as sustainable development needs.","at":"page 20, paragraph 24","th":["Human rights, ethics and democracy"]},{"e":"E00077","q":"Humbly, but also proudly, I can say that my country today serves as a Latin American benchmark for the future of artificial intelligence, and we will work tirelessly in that direction.","at":"page 20, paragraph 25","th":["National AI strategy and achievements"]}],"2023_CHN":[{"e":"E00078","q":"China supports the United Nations in serving as","at":"page 11, paragraph 8","th":[]},{"e":"E00079","q":"the main channel to create a widely accepted artificial intelligence governance framework, standards and norms, on the basis of full respect for the governance principles and practices of all countries.","at":"page 12, paragraph 9","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2023_CMR":[{"e":"E00080","q":"In this era of digital technology and artificial intelligence, we have prodigious tools at our disposal. If used wisely, they can enable us to achieve the desired results to ensure the survival of humankind and guarantee a better future.","at":"page 12, paragraph 22","th":["AI as epochal transformation"]}],"2023_CRI":[{"e":"E00081","q":"In addition, we urgently need new governance frameworks on cybersecurity, cybercrime and artificial intelligence.","at":"page 49, paragraph 6","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons"]}],"2023_DEU":[{"e":"E00082","q":"Artificial intelligence, for example, offers tremendous opportunities. At the same time, it can cement the division of the world if only a few benefit from it, if algorithms only take part of reality into account, or if access is limited to richer countries.","at":"page 47, paragraph 25","th":["UN bodies and processes on AI","Military AI and autonomous weapons","Bias, stereotypes and cultural diversity","AI divide and equitable access","AI as both promise and peril"]}],"2023_ESP":[{"e":"E00083","q":"We need to lay the groundwork for the regulation of artificial intelligence, the vast challenges and possibilities of which do not outweigh its hidden risks.","at":"page 47, paragraph 40","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","AI as both promise and peril"]}],"2023_ETH":[{"e":"E00084","q":"We should also ensure that new technologies such as artificial intelligence are used responsibly, in a manner that benefits humankind.","at":"page 17, paragraph 6","th":[]}],"2023_GBR":[{"e":"E00085","q":"Artificial intelligence (AI) is the biggest transformation the world has known. Our task as Governments is to understand it, grasp it and seek to govern it, and we must do so at speed.","at":"page 32, paragraph 4","th":["International AI rules and governance","AI as epochal transformation"]},{"e":"E00086","q":"Frontier AI, with the capacity to process the entirety of human knowledge in seconds, has the potential not just to transform our lives, but to reimagine our understanding of science.","at":"page 32, paragraph 5","th":["AI as epochal transformation"]},{"e":"E00087","q":"every single challenge discussed at this year’s General Assembly and more could be improved or even solved by AI.","at":"page 33, paragraph 6","th":["AI for development and the SDGs"]},{"e":"E00088","q":"The principal risks of frontier AI will therefore come from misuse, misadventure or misalignment with human objectives.","at":"page 33, paragraph 7","th":["International AI rules and governance","Frontier AI safety and loss of control","Disinformation and information integrity","Cyber threats, crime and terrorist misuse","AI divide and equitable access","AI as both promise and peril"]},{"e":"E00089","q":"Indeed, the stated aim of those companies is to build superintelligence, AI that strives","at":"page 33, paragraph 8","th":["Frontier AI safety and loss of control","Geopolitical competition and AI race"]},{"e":"E00090","q":"to surpass intelligence in every possible way. Some people working on that think it is just a few years away.","at":"page 33, paragraph 9","th":["Frontier AI safety and loss of control"]},{"e":"E00091","q":"We cannot afford to become trapped in debates about whether AI is a tool for good or a tool for ill; it will be a tool for both.","at":"page 33, paragraph 10","th":["International AI rules and governance","AI as both promise and peril"]},{"e":"E00092","q":"the necessary guardrails, regulation and governance must be developed in a parallel process with the technological progress.","at":"page 33, paragraph 11","th":["International AI rules and governance"]},{"e":"E00093","q":"the Group of Seven’s Hiroshima AI Process, the Global Partnership on AI","at":"page 33, paragraph 12","th":["International AI rules and governance"]},{"e":"E00094","q":"our Prime Minister has put AI safety at the forefront of his ambitions.","at":"page 33, paragraph 13","th":["National AI strategy and achievements"]},{"e":"E00095","q":"it is only by working together that we will make AI safe for everyone.","at":"page 33, paragraph 14","th":["International AI rules and governance","Frontier AI safety and loss of control","National AI strategy and achievements","Power concentration, dependence and sovereignty"]},{"e":"E00096","q":"the risk of extinction from AI should be a global priority","at":"page 34, paragraph 15","th":["Frontier AI safety and loss of control","Cyber threats, crime and terrorist misuse"]},{"e":"E00097","q":"Our summit will aim to reach a common understanding of those most extreme risks and how the world should confront them and, at the same time, focus on how safe AI can be used for public good.","at":"page 34, paragraph 16","th":["International AI rules and governance","Frontier AI safety and loss of control"]},{"e":"E00098","q":"The speed of its progress demands that this cannot be a one-off or even an annual gathering.","at":"page 34, paragraph 17","th":["International AI rules and governance"]},{"e":"E00099","q":"Technology companies must not mark their own homework","at":"page 34, paragraph 18","th":["Frontier AI safety and loss of control"]},{"e":"E00100","q":"It is the first body of its kind in the world that is developing the capacity to conduct the safe external red-teaming that will be critical to building confidence in frontier models.","at":"page 34, paragraph 19","th":["Frontier AI safety and loss of control","National AI strategy and achievements"]},{"e":"E00101","q":"A culture of rules and transparency is essential to creativity and innovation, and it is just as essential to making AI safe.","at":"page 34, paragraph 20","th":[]},{"e":"E00102","q":"we must work, alongside its pioneers, to understand it, to govern it, to harness its potential and to contain its risks.","at":"page 34, paragraph 21","th":["International AI rules and governance","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00103","q":"The AI revolution will be a bracing test for the multilateral system","at":"page 34, paragraph 22","th":["International AI rules and governance","UN bodies and processes on AI","AI as epochal transformation"]}],"2023_IDN":[{"e":"E00104","q":"Access to safe and secure digital technology for developing countries, including artificial intelligence, is crucial for future sustainable growth.","at":"page 34, paragraph 10","th":["AI divide and equitable access"]}],"2023_IND":[{"e":"E00105","q":"Others focus on new concerns, such as the responsible harnessing of artificial intelligence.","at":"page 2, paragraph 9","th":[]}],"2023_ISL":[{"e":"E00106","q":"Artificial intelligence asks some serious questions that will demand close multilateral cooperation to avoid the very real risk of this technology becoming a tool of destruction rather than creation.","at":"page 49, paragraph 15","th":["International AI rules and governance","Human rights, ethics and democracy","Disinformation and information integrity","AI as both promise and peril"]}],"2023_ISR":[{"e":"E00107","q":"the rise of artificial intelligence (AI). The AI revolution is progressing at lightning speed.","at":"page 6, paragraph 27","th":["AI as both promise and peril","AI as epochal transformation"]},{"e":"E00108","q":"We may have but a few years to adapt to the AI revolution.","at":"page 6, paragraph 28","th":["AI as epochal transformation"]},{"e":"E00109","q":"Yet even more disturbing is the potential eruption of AI-driven wars that could achieve an unimaginable scale.","at":"page 6, paragraph 29","th":["Military AI and autonomous weapons","Frontier AI safety and loss of control","Human rights, ethics and democracy","Disinformation and information integrity","Cyber threats, crime and terrorist misuse","Jobs, labour and economic transformation"]},{"e":"E00110","q":"We must ensure that the promise of an AI utopia does not turn into an AI dystopia.","at":"page 6, paragraph 30","th":["International AI rules and governance","AI for development and the SDGs","AI as both promise and peril"]},{"e":"E00111","q":"Our goal must be to ensure that AI brings more freedom and not less, prevents wars instead of starting them, and ensures that people live longer,","at":"page 6, paragraph 31","th":["International AI rules and governance","AI as a tool for peace","Human rights, ethics and democracy","National AI strategy and achievements"]},{"e":"E00112","q":"healthier, more productive and peaceful lives. That is in our reach.","at":"page 7, paragraph 32","th":[]},{"e":"E00113","q":"As we harness the powers of AI, let us always remember the irreplaceable value of human intuition and wisdom.","at":"page 7, paragraph 33","th":["AI as both promise and peril","AI as epochal transformation"]}],"2023_ITA":[{"e":"E00114","q":"Let us just consider artificial intelligence. The applications of that new technology may offer great opportunities in many fields, but we cannot pretend to not understand its enormous inherent risks.","at":"page 43, paragraph 19","th":["AI as both promise and peril"]},{"e":"E00115","q":"today the human intellect risks being replaced, with consequences that could be devastating, particularly for the job market.","at":"page 43, paragraph 20","th":["Jobs, labour and economic transformation","Power concentration, dependence and sovereignty"]},{"e":"E00116","q":"We need global governance mechanisms that ensure that such technologies respect ethical boundaries and that technological development remains at the service of humankind, and not vice versa.","at":"page 43, paragraph 21","th":["International AI rules and governance","Human rights, ethics and democracy"]},{"e":"E00117","q":"Those are some of the major themes on which Italy will focus during its presidency of the Group of Seven in 2024. However, they are mainly issues that are the responsibility of the United Nations.","at":"page 43, paragraph 22","th":[]}],"2023_JPN":[{"e":"E00118","q":"That is why, at the G-7 Hiroshima Summit, we launched the Hiroshima Artificial Intelligence (AI) Process on generative AI, towards attaining trustworthy AI.","at":"page 49, paragraph 13","th":["International AI rules and governance","Human rights, ethics and democracy"]}],"2023_KOR":[{"e":"E00119","q":"digital advancements can be achieved only when fair access to artificial intelligence (AI) and digital technologies, as well as their safe use, is ensured.","at":"page 44, paragraph 10","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","Disinformation and information integrity","AI divide and equitable access","National AI strategy and achievements"]},{"e":"E00120","q":"Korean Government plans to host a global AI forum.","at":"page 44, paragraph 11","th":["UN bodies and processes on AI","National AI strategy and achievements"]}],"2023_LSO":[{"e":"E00121","q":"Even as we hail and support technological innovations, such as artificial intelligence and social media,","at":"page 9, paragraph 19","th":["Human rights, ethics and democracy","AI as both promise and peril"]}],"2023_MAR":[{"e":"E00122","q":"international cooperation and solidarity in the promotion of scientific research, including artificial intelligence","at":"page 44, paragraph 7","th":["AI for development and the SDGs"]}],"2023_MCO":[{"e":"E00123","q":"I refer to artificial intelligence, which carries with it both immense potential for accelerating the achievement of the Sustainable Development Goals and unprecedented risks for global peace and security.","at":"page 17, paragraph 21","th":["AI for development and the SDGs","AI as both promise and peril"]},{"e":"E00124","q":"I welcome all the work aimed at developing a high-level consultative body within the United Nations to work on the international governance of artificial intelligence.","at":"page 17, paragraph 22","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons","Human rights, ethics and democracy","Cyber threats, crime and terrorist misuse"]}],"2023_MKD":[{"e":"E00125","q":"Some others, although of newer date, such as artificial intelligence, are already causing major changes in our lives.","at":"page 3, paragraph 22","th":[]}],"2023_MLT":[{"e":"E00126","q":"How we feel about our futures is, unfortunately, not helped by lurid media headlines about the machines taking over, spreading fear about AI taking jobs and rendering human effort obsolete.","at":"page 16, paragraph 30","th":["Jobs, labour and economic transformation","AI as both promise and peril"]},{"e":"E00127","q":"To make AI a global good, we need global action. Malta stands resolutely behind efforts to increase and enhance international cooperation on AI.","at":"page 16, paragraph 31","th":["International AI rules and governance","AI for development and the SDGs","National AI strategy and achievements"]}],"2023_NAM":[{"e":"E00128","q":"Rapid advances in technology, quantum computing and artificial intelligence are transforming the global landscape, offering unprecedented challenges and opportunities for growth and development.","at":"page 9, paragraph 10","th":["AI divide and equitable access","Capacity building and AI cooperation","AI as both promise and peril","AI as epochal transformation"]}],"2023_NIC":[{"e":"E00129","q":"In the face of all the advances in science, techniques and technologies, including those portentously called “artificial intelligence” — as if they were not the result of human intelligence — Nicaragua demands the full participation of the peoples who have made those advances of the conquistadors possible with our blood and resources.","at":"page 26, paragraph 27","th":["AI divide and equitable access","Power concentration, dependence and sovereignty"]}],"2023_NPL":[{"e":"E00130","q":"The potential dual uses of artificial intelligence call for urgent, informed deliberations on preventing its potential misuse and strengthening international cooperation.","at":"page 33, paragraph 23","th":["International AI rules and governance","AI as both promise and peril"]}],"2023_NZL":[{"e":"E00131","q":"We must commit to international rules and limits on autonomous weapon systems and establish clear norms to address responsible use of other new and emerging","at":"page 42, paragraph 14","th":["Military AI and autonomous weapons"]},{"e":"E00132","q":"technologies, including artificial intelligence, as well as the continued peaceful use of outer space.","at":"page 42, paragraph 15","th":[]}],"2023_QAT":[{"e":"E00133","q":"In areas such as genetics and artificial intelligence, the possibilities for realizing the well-being of all humanity are increasing. But the gap between possibility and reality is also widening.","at":"page 34, paragraph 5","th":[]},{"e":"E00134","q":"At the same time, it is not plausible to ignore the worsening risks in terms of reality falsification, invasion of personal privacy, educational process disruption through the facilitation of plagiarism, and the spiralling effect of disinformation and ploys aimed at deception.","at":"page 35, paragraph 8","th":[]},{"e":"E00135","q":"Therefore, in addition to the necessity of cooperation and investment in developing those technologies, we reiterate the call for unifying efforts to prevent the misuse of cyberspace and regulate this vital aspect, based on the provisions of international law.","at":"page 35, paragraph 9","th":[]}],"2023_SGP":[{"e":"E00136","q":"AI agents with the ability to negotiate and transact with each other and humans, and often we will not be able to tell the difference.","at":"page 35, paragraph 12","th":["Military AI and autonomous weapons","AI divide and equitable access","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00137","q":"Generative artificial intelligence holds much promise, but it may also lead us to cross a Rubicon and into more danger than we can control.","at":"page 35, paragraph 13","th":["AI as both promise and peril"]},{"e":"E00138","q":"AI will fundamentally disrupt our assumptions on military doctrine and strategic deterrence.","at":"page 35, paragraph 14","th":["Military AI and autonomous weapons"]},{"e":"E00139","q":"There will be many occasions when humans may not even be in the firing loop","at":"page 36, paragraph 15","th":["Military AI and autonomous weapons"]},{"e":"E00140","q":"the advent of artificial intelligence in conflict situations has actually increased the risks exponentially.","at":"page 36, paragraph 16","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons","AI as both promise and peril"]},{"e":"E00141","q":"this offers some useful lessons for other areas, including AI.","at":"page 36, paragraph 17","th":["International AI rules and governance","UN bodies and processes on AI"]},{"e":"E00142","q":"We need to bring the same constructive spirit to other areas of the global commons — AI, cybersecurity, digital technology and even outer space.","at":"page 36, paragraph 21","th":["International AI rules and governance"]}],"2023_SOM":[{"e":"E00143","q":"We see that new technologies, such as artificial intelligence, pose new and terrifying threats to all of us.","at":"page 13, paragraph 7","th":["AI listed among threats or crises"]}],"2023_SRB":[{"e":"E00144","q":"the artificial intelligence institute","at":"page 24, paragraph 10","th":["National AI strategy and achievements"]},{"e":"E00145","q":"Serbia is the first country in the South-East Europe region that joined the Global Partnership on Artificial Intelligence and adopted a development strategy in that area back in 2019.","at":"page 28, paragraph 42","th":["National AI strategy and achievements"]}],"2023_SVK":[{"e":"E00146","q":"If these issues are not addressed, social media platforms, artificial intelligence and other emerging technologies can act like steroids on our current crises. That is why we cannot postpone their democratic regulation.","at":"page 24, paragraph 10","th":["Human rights, ethics and democracy","AI as both promise and peril"]}],"2023_SVN":[{"e":"E00147","q":"Artificial intelligence can be useful, but it can also be dangerous.","at":"page 54, paragraph 11","th":["UN bodies and processes on AI","AI as both promise and peril"]},{"e":"E00148","q":"We need to find a way to govern the development of new technologies, including artificial intelligence, in a way that does not impede economic, development, social and research opportunities and does not put us at risk.","at":"page 54, paragraph 12","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy"]}],"2023_SWE":[{"e":"E00149","q":"Emerging technologies, including artificial intelligence, are transforming our world. They offer unprecedented possibilities, including to accelerate our efforts on climate change, global health and the Sustainable Development Goals.","at":"page 46, paragraph 13","th":["International AI rules and governance","UN bodies and processes on AI","AI for development and the SDGs","AI as both promise and peril","AI as epochal transformation"]}],"2023_UKR":[{"e":"E00150","q":"Artificial intelligence could be trained to fight well before it would learn to help humankind.","at":"page 44, paragraph 12","th":["Military AI and autonomous weapons"]}],"2023_URY":[{"e":"E00151","q":"We are convinced that globalization, information technology, artificial intelligence and real-time communication are tools that help the integration and development of our peoples","at":"page 37, paragraph 4","th":[]}],"2023_USA":[{"e":"E00152","q":"Together with leaders around the world, the United States is working to strengthen rules and policies so artificial intelligence technologies are safe before they are released to the public","at":"page 12, paragraph 13","th":["International AI rules and governance","UN bodies and processes on AI","Frontier AI safety and loss of control","Human agency, control and accountability","AI as both promise and peril"]},{"e":"E00153","q":"we harness the power of artificial intelligence for good while protecting our citizens from its most profound risk.","at":"page 13, paragraph 14","th":["International AI rules and governance","AI as both promise and peril"]}],"2023_VCT":[{"e":"E00154","q":"the seemingly uncontrollable chariots of artificial intelligence;","at":"page 2, paragraph 8","th":["AI listed among threats or crises"]}],"2023_VEN":[{"e":"E00155","q":"The protection of cyberspace, the fight against cybercrime, the regulation of new information technologies, social media and artificial intelligence must become a strategic priority for the United Nations.","at":"page 28, paragraph 18","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","Power concentration, dependence and sovereignty"]}],"2023_ZMB":[{"e":"E00156","q":"The elements of that package hold great potential to catalyse transformative actions in least developed countries in critical sectors such as renewable energy, social protection for the weak, health care, quality education, food security, resilient infrastructure, artificial intelligence (AI) and information technology.","at":"page 13, paragraph 7","th":["AI listed among technologies"]},{"e":"E00157","q":"We need only imagine using AI to deliver lifesaving medicines to a seemingly forgotten grandmother in a village in Africa, or the grand transformation we can achieve in harnessing the fertile soils of countries like Zambia using the technology of precision irrigation.","at":"page 13, paragraph 12","th":["AI for development and the SDGs"]}],"2024_ARE":[{"e":"E00158","q":"harness emerging technologies, such as artificial intelligence, as essential tools to find innovative solutions for our businesses, lives and Government services.","at":"page 39, paragraph 27","th":["AI for development and the SDGs","National AI strategy and achievements"]}],"2024_BDI":[{"e":"E00159","q":"At a time when the world and trade are becoming increasingly digital, it is becoming imperative for all countries to have access to the Internet, including artificial intelligence, which is revolutionizing the world as we speak.","at":"page 27, paragraph 29","th":["AI divide and equitable access"]}],"2024_BGD":[{"e":"E00160","q":"The world needs to ensure that no young people in countries like Bangladesh are left behind in reaping meaningful benefits from the AI-led transformation. At the same time, the world needs to ensure that the development of artificial intelligence does not diminish the scope of or demand for human labour.","at":"page 30, paragraph 29","th":["AI divide and equitable access","Jobs, labour and economic transformation","Youth, education and skills"]},{"e":"E00161","q":"We believe that unless autonomous intelligence develops in a responsible manner, it could pose existential threats to human existence.","at":"page 31, paragraph 30","th":["Frontier AI safety and loss of control"]}],"2024_BHR":[{"e":"E00162","q":"today we call for an international treaty governing the development of artificial intelligence to ensure that such technologies contribute to peace rather than exacerbating existing conflicts and become forces for creation and innovation, not destruction and division.","at":"page 50, paragraph 14","th":["International AI rules and governance","AI as a tool for peace"]}],"2024_BOL":[{"e":"E00163","q":"Unprecedented technological transformations, through the development of new technologies and artificial intelligence, are advances that are redefining the way we interact, work and face our daily lives.","at":"page 54, paragraph 6","th":["International AI rules and governance","Human rights, ethics and democracy","AI divide and equitable access","Power concentration, dependence and sovereignty","AI as epochal transformation"]}],"2024_BRA":[{"e":"E00164","q":"We need a system of intergovernmental governance of artificial intelligence, in which all States have a seat.","at":"page 10, paragraph 16","th":["International AI rules and governance","Equal voice in AI rule-making","AI as a tool for peace","Human rights, ethics and democracy","Bias, stereotypes and cultural diversity","Power concentration, dependence and sovereignty"]}],"2024_CHL":[{"e":"E00165","q":"Chile is also committed to the development of regulations for guiding the progress of artificial intelligence in an ethical, transparent and responsible manner, respecting human rights, protecting personal data and promoting the integrity of information and its use in the digital era.","at":"page 24, paragraph 24","th":["Human rights, ethics and democracy","Bias, stereotypes and cultural diversity","Power concentration, dependence and sovereignty"]},{"e":"E00166","q":"If we do not take action now, for example by demanding algorithm traceability, data audits and corrective human interventions, we might see a new kind of extermination in a few years","at":"page 24, paragraph 25","th":["Bias, stereotypes and cultural diversity","AI divide and equitable access"]},{"e":"E00167","q":"Artificial intelligence and new technologies can be a significant contribution to the world.","at":"page 24, paragraph 26","th":[]}],"2024_CHN":[{"e":"E00168","q":"China supports the United Nations role as the main channel for global AI governance and is committed to strengthening international cooperation on AI capacity-building.","at":"page 15, paragraph 22","th":["International AI rules and governance","UN bodies and processes on AI","Capacity building and AI cooperation"]}],"2024_CIV":[{"e":"E00169","q":"Artificial intelligence holds great promise for our societies, but it can also pose a number of threats and lead to abuses, owing to the lack of international regulations governing its use.","at":"page 12, paragraph 7","th":["International AI rules and governance","UN bodies and processes on AI","AI divide and equitable access","AI as both promise and peril","AI as epochal transformation"]}],"2024_CMR":[{"e":"E00170","q":"We have at our disposal the necessary means thanks to the prodigious growth of science, technology and artificial intelligence.","at":"page 72, paragraph 21","th":["AI listed among technologies"]}],"2024_COL":[{"e":"E00171","q":"the high levels of productivity achieved today, including artificial intelligence, and that must be controlled by a global public authority.","at":"page 34, paragraph 13","th":["International AI rules and governance","Power concentration, dependence and sovereignty"]}],"2024_COM":[{"e":"E00172","q":"We call for genuine international collaboration to establish guidelines that will lead to legal tools guaranteeing the development and equitable use of artificial intelligence, conducive to development, growth, productivity and knowledge throughout the world.","at":"page 38, paragraph 10","th":["International AI rules and governance","AI for development and the SDGs"]}],"2024_CRI":[{"e":"E00173","q":"Costa Rica calls for a consensus to be reached on governance frameworks for artificial intelligence in both the military and civilian spheres.","at":"page 48, paragraph 13","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons"]}],"2024_CZE":[{"e":"E00174","q":"It is our duty to ensure that innovations — including artificial intelligence, autonomous systems, biotechnology and quantum computing — fully conform to our ethical and human rights standards.","at":"page 10, paragraph 8","th":["Human rights, ethics and democracy"]}],"2024_DJI":[{"e":"E00175","q":"to promote safe, secure and trustworthy artificial intelligence systems for sustainable development.","at":"page 52, paragraph 10","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2024_DZA":[{"e":"E00176","q":"Africa looks forward to addressing economic development and joining the revolutions currently taking place in the fields of artificial intelligence, digitalization and renewable energy.","at":"page 22, paragraph 10","th":["AI listed among technologies"]}],"2024_EGY":[{"e":"E00177","q":"the welcome role that the United Nations is trying to play in confronting emerging challenges, such as digital cooperation, crime, cybersecurity and artificial intelligence","at":"page 70, paragraph 21","th":["UN bodies and processes on AI","AI listed among threats or crises"]}],"2024_ESP":[{"e":"E00178","q":"But new ones, such as the expansion of artificial intelligence are also emerging.","at":"page 33, paragraph 29","th":["Human rights, ethics and democracy","AI as epochal transformation"]},{"e":"E00179","q":"We must support those recommendations and move forward with that common effort so as to ensure that decisions about artificial intelligence are not left in the hands of a few","at":"page 33, paragraph 30","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy"]}],"2024_EST":[{"e":"E00180","q":"I want to live in a world where everybody can feel free, where artificial intelligence serves rather than","at":"page 17, paragraph 1","th":[]},{"e":"E00181","q":"hinders humanity","at":"page 18, paragraph 2","th":[]}],"2024_FIN":[{"e":"E00182","q":"Some 30 years ago, we thought that digitalization, artificial intelligence, robotization and biotech would automatically deliver a better world for us and that technology would be a force for good only.","at":"page 5, paragraph 10","th":["AI as both promise and peril"]}],"2024_FRA":[{"e":"E00183","q":"We need to ensure that innovation in artificial intelligence is accessible to all the countries and peoples of the planet and that it does not fuel new divides and inequalities. But we need all of that to develop within a united ethical and democratic framework, designed by the peoples of the planet.","at":"page 61, paragraph 33","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","AI divide and equitable access","National AI strategy and achievements","Power concentration, dependence and sovereignty"]}],"2024_GBR":[{"e":"E00184","q":"Incredible new technologies like artificial intelligence are being deployed for military use without agreed rules.","at":"page 29, paragraph 8","th":["Military AI and autonomous weapons"]}],"2024_GRC":[{"e":"E00185","q":"or even the unchecked rise of artificial intelligence, those challenges jeopardize our present and our future.","at":"page 23, paragraph 2","th":["AI listed among threats or crises"]},{"e":"E00186","q":"Let me conclude by addressing briefly two issues critical to our shared future: the advent of artificial intelligence (AI) and the adverse effects of digital technology, especially on our children and our teenagers.","at":"page 26, paragraph 16","th":[]},{"e":"E00187","q":"We are already seeing how generative AI is used to create more and more convincing deepfakes, designed to spread misinformation and disinformation.","at":"page 26, paragraph 17","th":["Disinformation and information integrity","AI for development and the SDGs","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00188","q":"The recommendations of this report can truly contribute to an agile and adaptable regime of global governance of AI that helps to showcase the benefits of AI and address its risks.","at":"page 26, paragraph 18","th":["International AI rules and governance","UN bodies and processes on AI","Power concentration, dependence and sovereignty"]},{"e":"E00189","q":"Eventually, what we may need is a conference of the parties for AI, with the participation not just of countries but also of the global technology companies.","at":"page 26, paragraph 19","th":["International AI rules and governance","UN bodies and processes on AI"]},{"e":"E00190","q":"Social media algorithms are constantly improved by AI to keep children online for the maximum amount of time and away from the real world of unsupervised play, and all for the purpose","at":"page 26, paragraph 20","th":["Protecting children from AI harms"]},{"e":"E00191","q":"of making money. Countless studies have shown that heavy use of social media is linked to depression, feelings of isolation, sleep deprivation and addiction.","at":"page 27, paragraph 21","th":["Protecting children from AI harms"]},{"e":"E00192","q":"Technology companies must come to the table and show that they will take tangible and measurable action and prioritize safety over profits.","at":"page 27, paragraph 22","th":[]}],"2024_HTI":[{"e":"E00193","q":"The acceleration of the development of artificial intelligence, the proliferation of cyberattacks and disinformation endanger the stability of democracies around the world.","at":"page 29, paragraph 19","th":["AI listed among threats or crises"]}],"2024_ISR":[{"e":"E00194","q":"Our two countries could cooperate on energy, water, agriculture, artificial intelligence and many, many other fields.","at":"page 11, paragraph 25","th":["AI listed among technologies"]}],"2024_ITA":[{"e":"E00195","q":"It is no coincidence that Italy made this issue a top priority of its presidency of the Group of Seven (G7), because we want to do our part in defining a global governance for artificial intelligence that is able to strike a balance among innovation, rights, labour, intellectual property, freedom of expression and democracy.","at":"page 51, paragraph 2","th":["International AI rules and governance","Human rights, ethics and democracy","Jobs, labour and economic transformation","Power concentration, dependence and sovereignty","AI as epochal transformation"]}],"2024_JPN":[{"e":"E00196","q":"Among such digital technologies, there is an urgent need to establish international governance on artificial intelligence (AI) in order to maximize the opportunities brought by AI while mitigating its risks. Japan has been working through the Hiroshima AI Process to achieve safe, secure and trustworthy AI.","at":"page 41, paragraph 27","th":["International AI rules and governance","UN bodies and processes on AI","AI as both promise and peril"]}],"2024_KAZ":[{"e":"E00197","q":"The rapid development of artificial intelligence (AI) exacerbates cyberthreats and brings new challenges. That includes its potential uses in 4, paragraph 16","th":[]}],"2024_LKA":[{"e":"E00202","q":"New domains are being weaponized including outer space and cyberspace, while the use of artificial intelligence is challenging international humanitarian law on the battlefield.","at":"page 40, paragraph 6","th":["Military AI and autonomous weapons"]},{"e":"E00203","q":"Digital technologies and artificial intelligence offer unprecedented opportunities to accelerate sustainable development.","at":"page 41, paragraph 14","th":["AI divide and equitable access","Capacity building and AI cooperation","AI for development and the SDGs"]}],"2024_LVA":[{"e":"E00204","q":"The rising capabilities of artificial intelligence provide a lot of opportunities for growth and development, but the potential for their misuse is a concern.","at":"page 27, paragraph 16","th":["AI as both promise and peril"]}],"2024_MAR":[{"e":"E00205","q":"In the face of our societies’ changing needs and the challenges confronting our countries, the rapidly occurring changes at the level of social media, information technology and artificial intelligence are significant and interconnected.","at":"page 54, paragraph 2","th":["AI as epochal transformation"]}],"2024_MCO":[{"e":"E00206","q":"The Principality of Monaco is committed to capitalizing on the opportunities provided by safe, secure and trustworthy artificial intelligence systems for sustainable development.","at":"page 39, paragraph 10","th":["International AI rules and governance","Military AI and autonomous weapons","Human rights, ethics and democracy","AI for development and the SDGs","AI as both promise and peril"]}],"2024_MDV":[{"e":"E00207","q":"by transforming its economy into one that is fully digitized and driven by artificial intelligence (AI)","at":"page 43, paragraph 6","th":["Jobs, labour and economic transformation","National AI strategy and achievements"]},{"e":"E00208","q":"We are using and expanding artificial intelligence systems to deliver essential services such as healthcare, education and social welfare.","at":"page 43, paragraph 7","th":["AI for development and the SDGs","National AI strategy and achievements"]},{"e":"E00209","q":"to build a generation that can use artificial intelligence to enhance the delivery of public services, build new products and compete successfully in the global digital economy.","at":"page 43, paragraph 8","th":["Youth, education and skills","National AI strategy and achievements"]}],"2024_MNG":[{"e":"E00210","q":"intensive discussions on information and communications technologies and artificial intelligence have arisen in international forums, and the recently adopted Global Digital Compact is a timely and essential step.","at":"page 3, paragraph 12","th":["International AI rules and governance","UN bodies and processes on AI"]},{"e":"E00211","q":"States to ensure the reliability and security of artificial intelligence (resolution 78/265), in a significant step forward.","at":"page 4, paragraph 13","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2024_MUS":[{"e":"E00212","q":"In order for humankind to benefit from the transformative power of artificial intelligence (AI), AI governance should be anchored in international law.","at":"page 6, paragraph 6","th":["International AI rules and governance"]}],"2024_MWI":[{"e":"E00213","q":"Even with the era of artificial intelligence being fully upon us, I worry that the rules for regulating that arena are already being written to empower some nations and give them unfair advantages over others.","at":"page 3, paragraph 11","th":["Equal voice in AI rule-making"]}],"2024_NGA":[{"e":"E00214","q":"With the evolution of artificial intelligence, that divide risks becoming wider still.","at":"page 46, paragraph 21","th":["AI divide and equitable access"]},{"e":"E00215","q":"eliminating barriers to the digital economy in Africa, such as the high costs of Internet services and intellectual property rights.","at":"page 47, paragraph 22"  bodies and processes on AI"]}],"2024_SGP":[{"e":"E00223","q":"We have labelled that programme FOSS for Good, a package that will offer digital-themed programmes, including Leadership and Governance in the Age of Digital Technologies and Artificial Intelligence.","at":"page 52, paragraph 18","th":["Capacity building and AI cooperation"]},{"e":"E00224","q":"We need to empower innovation in AI, whilst installing global guardrails to protect human safety, human dignity and values. Therefore, initiating a dialogue on the global governance of AI is imperative.","at":"page 53, paragraph 22","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","AI as both promise and peril","AI as epochal transformation"]}],"2024_SLE":[{"e":"E00225","q":"ensuring safe, secure and trustworthy emerging technologies, including artificial intelligence, to offer new opportunities to accelerate development, leaving no one behind.","at":"page 54, paragraph 12","th":["UN bodies and processes on AI","AI for development and the SDGs"]}],"2024_SMR":[{"e":"E00226","q":"Unfortunately, today, owing to increasing tensions, the deterioration of the disarmament architecture, the use of new emerging technologies, including artificial intelligence, and the possibilities of cyberattacks, the risk of nuclear weapons use, either deliberately or by accident, is higher than it has been at any time since the Cold War.","at":"page 61, paragraph 10","th":["Military AI and autonomous weapons"]}],"2024_SVN":[{"e":"E00227","q":"As catastrophic floods devastated my home country last year, we initiated the development of an advanced digital solution linking Earth observation with supercomputing and artificial intelligence. The system will help us predict floods and droughts and improve our resilience. We are ready to share that solution with our partners globally.","at":"page 3, paragraph 15","th":["Capacity building and AI cooperation","AI for development and the SDGs","National AI strategy and achievements"]},{"e":"E00228","q":"I call upon all to form a global partnership around Early Warnings for All to help overcome those challenges.","at":"page 3, paragraph 16","th":[]}],"2024_SWE":[{"e":"E00229","q":"establish the governance required for a sustainable digital future, including with respect to artificial intelligence.","at":"page 44, paragraph 15","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2024_TJK":[{"e":"E00230","q":"I propose that the General Assembly adopt a special draft resolution on the role of artificial intelligence in creating new opportunities for socioeconomic development and accelerating the achievement of the Sustainable Development Goals in Central Asia.","at":"page 47, paragraph 6","th":["UN bodies and processes on AI","AI for development and the SDGs"]}],"2024_TUR":[{"e":"E00231","q":"We see technological breakthroughs such as artificial intelligence as a potential source not of injustice and conflict but a more prosperous future, and we believe that all nations should benefit equally from the transformative power of such breakthrough technologies.","at":"page 22, paragraph 46","th":["AI divide and equitable access","AI as both promise and peril"]}],"2024_USA":[{"e":"E00232","q":"the promises and significant risks of artificial intelligence (AI).","at":"page 13, paragraph 8","th":["AI listed among threats or crises"]},{"e":"E00233","q":"Artificial intelligence is going to change our ways of life, work and war.","at":"page 15, paragraph 23","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons","Disinformation and information integrity","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00234","q":"First, how do we as an international community govern AI?","at":"page 15, paragraph 24","th":["International AI rules and governance","Frontier AI safety and loss of control","AI divide an nd compassion.","at":"at 9:27:19 in the recording","th":["Human rights, ethics and democracy"]}],"2025_ARE":[{"e":"E00242","q":"In the fields of science, technology, and artificial intelligence, my country has sought to harness these tools to advance sustainable development around the world.","at":"at 9:35:50 in the recording","th":["Capacity building and AI cooperation","AI for development and the SDGs"]}],"2025_BGD":[{"e":"E00243","q":"We are investing in their skills in information technology, artificial intelligence, renewable energy, and green innovation.","at":"at 2:41:34 in the recording","th":["Youth, education and skills"]},{"e":"E00244","q":"Quantum computing, artificial intelligence, large language models, modern communication systems, these must not be biased, and their benefits must be shared fairly with all.","at":"at 3:00:00 in the recording","th":["Bias, stereotypes and cultural diversity","AI divide and equitable access","Youth, education and skills"]},{"e":"E00245","q":"The problem has been compounded by the deliberate use of fake news and artificial intelligence-driven deepfakes, which make the situation even more dangerous.","at":"at 3:00:00 in the recording","th":["Disinformation and information integrity"]},{"e":"E00246","q":"We must work together to confront these distortions before they erode trust among people and weaken the bonds of social harmony.","at":"at 3:00:00 in the recording","th":["Disinformation and information integrity"]}],"2025_BGR":[{"e":"E00247","q":"Bulgaria supports inclusive, multi-stakeholder approaches to global digital governance, artificial intelligence, and space technologies, ensuring they advance the sustainable development goals.","at":"at 7:00:00 in the recording","th":["International AI rules and governance","AI for development and the SDGs"]}],"2025_BHR":[{"e":"E00248","q":"We also seek to promote digital innovation and artificial intelligence with the aim of providing a safe, stable, prosperous, and sustainable environment.","at":"at 11:00:04 in the recording","th":["National AI strategy and achievements"]},{"e":"E00249","q":"called for the adoption of an international convention to regulate and govern the development of AI.","at":"at 11:00:04 in the recording","th":["International AI rules and governance"]}],"2025_BLZ":[{"e":"E00250","q":"Taiwan is a thriving democracy with global leadership in high-tech innovation, semiconductors, AI, biotechnology, renewable energy, all vital to global supply chain security and sustainable development.","at":"at 6:01:50 in the recording","th":["AI listed among technologies"]}],"2025_BOL":[{"e":"E00251","q":"The danger here is that the unstoppable force of capitalism with the misuse of artificial intelligence would increase the climate change, would liquidate the planet and would convert the immense majority of the population into unnecessary beings is also something that we can't completely rule out.","at":"at 2:15:29 in the recording","th":["Jobs, labour and economic transformation"]}],"2025_BRA":[{"e":"E00252","q":"To mitigate the risks of artificial intelligence, we are committed to building multilateral governance in line with the global digital compact that was approved in this plenary last year.","at":"at 1:10:37 in the recording","th":["International AI rules and governance","UN bodies and processes on AI"]}],"2025_BRB":[{"e":"E00253","q":"And of course, unregulated AI, which while it has tremendous promise, poses unregulated significant risk.","at":"at 4:29:03 in the recording","th":["AI listed among threats or crises"]},{"e":"E00254","q":"to allow us to better face challenges from climate to pandemics to unregulated AI","at":"at 4:29:03 in the recording","th":["AI listed among threats or crises"]},{"e":"E00255","q":"The two instruments mentioned on Tuesday morning by our Secretary General for regulating AI must now be our priority","at":"at 4:29:03 in the recording","th":["International AI rules and governance","UN bodies and icial intelligence, a technology that benefits all","at":"transcript lines 187-187","th":["UN bodies and processes on AI","AI divide and equitable access"]}],"2025_DMA":[{"e":"E00270","q":"They are at the frontier of the artificial intelligence and other emerging technologies with expanding digital infrastructure and rising standards of living.","at":"at 6:39:17 in the recording","th":["AI divide and equitable access"]}],"2025_ECU":[{"e":"E00271","q":"Emerging technologies, in particular artificial intelligence, offer up unprecedented opportunities for human progress. However, they also offer up significant risks for security, equity and human rights.","at":"at 10:45:33 in the recording","th":["International AI rules and governance","Human rights, ethics and democracy","AI divide and equitable access","AI as both promise and peril"]}],"2025_EGY":[{"e":"E00272","q":"We also look forward to enhancing efforts for developing countries to have access to AI and digital technologies.","at":"at 5:18:56 in the recording","th":["AI divide and equitable access"]}],"2025_ESP":[{"e":"E00273","q":"There are other just as important challenges, including managing the impact of the transformative revolution known as artificial intelligence which can accelerate progress on the 2030 agenda if we know how to direct it towards a fair and equitable digital transformation","at":"at 0:16:10 in the recording","th":["AI for development and the SDGs","AI as epochal transformation"]}],"2025_EST":[{"e":"E00274","q":"Therefore, Estonia is making a new leap, the artificial intelligence leap. We are again providing the best technological tools available to our students and teachers, so that we keep comparative edge in education for years to come.","at":"at 3:12:54 in the recording","th":["Youth, education and skills","National AI strategy and achievements"]},{"e":"E00275","q":"Equipping citizens with the skills to use AI wisely and responsibly is essential. They must serve dignity, development, and human rights, not the other way around.","at":"at 3:12:54 in the recording","th":["Human rights, ethics and democracy"]}],"2025_FRA":[{"e":"E00276","q":"I'm not forgetting bacteriological, chemical threats or the new risks that posed by AI.","at":"at 9:04:56 in the recording","th":["AI listed among threats or crises"]}],"2025_FSM":[{"e":"E00277","q":"global cooperation is essential to ensure that AI systems remain safe, secure, and trustworthy.","at":"at 7:00:00 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","Military AI and autonomous weapons","AI as both promise and peril"]}],"2025_GBR":[{"e":"E00278","q":"AI is the most powerful new lever we have to advance the Charter's vision of social progress, better standards of life.","at":"at 9:42:46 in the recording","th":["AI for development and the SDGs","National AI strategy and achievements","AI as epochal transformation"]},{"e":"E00279","q":"Only by cooperation together can we set artificial intelligence on the right millennia-defining course.","at":"at 9:42:46 in the recording","th":["Human rights, ethics and democracy","Disinformation and information integrity","Cyber threats, crime and terrorist misuse","AI divide and equitable access","AI for development and the SDGs","Jobs, labour and economic transformation","National AI strategy and achievements","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00280","q":"And I welcome the new global dialogue on AI governance.","at":"at 9:42:46 in the recording","th":["UN bodies and processes on AI","AI divide and equitable access","Capacity building and AI cooperation","AI for development and the SDGs","National AI strategy and achievements"]}],"2025_GHA":[{"e":"E00281","q":"We live in a world of cryptocurrency, artificial intelligence, social media, the internet and its dark hidden dungeon of the dark web, all of which carry a potential threat to global peace and security.","at":"at 3:00:00 in the recording","th":["AI listed among threats or crises"]},{"e":"E00282","q":"The internet, social media platforms, and artificial intelligence offer us the illusion of connectivity, when in fact, what they do is reinforce isolation by using algorithms that ensure that we do not receive new ideas and perspectives, but rather more of the same content.","at":"at 3:00:00 in the recording","th":["Disinformation and information integrity"]}],"2025_GRC":[{"e":"E00283","q":"And this trend is strengthening at a time when global challenges continue to multiply. Climate change, migration, the advent of artificial intelligence.","at":"at 3:51:50 in the recording","th":["AI listed among threats or crises"]},{"e":"E00284","q":"Today, Greece is pursuing a visionary yet practical AI strategy through pilot programs in areas such as education, healthcare, and natural disaster prevention. Teachers and students will soon engage with custom designated AI teaching assistants.","at":"at 4:00:00 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","Disinformation and information integrity","Jobs, labour and economic transformation","Youth, education and skills","Protecting children from AI harms","National AI strategy and achievements","Power concentration, dependence and sovereignty","AI as both promise and peril"]},{"e":"E00285","q":"We don't want our kids to share their intimate thoughts and feelings with an AI chatbot.","at":"at 4:00:00 in the recording","th":["Protecting children from AI harms"]}],"2025_GRD":[{"e":"E00286","q":"In another, children are using artificial intelligence in their lessons.","at":"at 0:34:29 in the recording","th":["Youth, education and skills"]},{"e":"E00287","q":"we are considering the teaching, understanding, and use of AI and AI related skills to enhance education access, delivery, and outcome.","at":"at 0:34:29 in the recording","th":["Youth, education and skills"]}],"2025_GUY":[{"e":"E00288","q":"We recognize the indispensable nature of AI in our collective future. However, while there are immense benefits, there is no clarity on equity, access, and applicability. regulations, ethical standards, and governance mechanisms are urgently needed.","at":"at 8:00:00 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","AI divide and equitable access","Energy, minerals and environmental footprint","National AI strategy and achievements"]}],"2025_HRV":[{"e":"E00289","q":"Artificial intelligence, cyber capabilities, space technologies, robotics, each can be a threat or a solution. The choice is ours. We need to rethink security, not only nationally but globally. Rules, safeguards, and cooperation must keep pace with innovation.","at":"at 4:21:24 in the recording","th":["International AI rules and governance","AI as both promise and peril"]}],"2025_HTI":[{"e":"E00290","q":"We must ensure that all of our actions, including technological breakthroughs such as artificial intelligence, foster peace, development, and human dignity.","at":"at 1:45:40 in the recording","th":[]}],"2025_IND":[{"e":"E00291","q":"Artificial intelligence as a horizontal and cross-cutting technology has a particular promise for development.","at":"at 5:01:27 in the recording","th":["AI for development and the SDGs","National AI strategy and achievements"]}],"2025_ISL":[{"e":"E00292","q":"To distort free speech into the mass production of lies, propaganda, or AI-driven disinformation is not the exercise of freedom. It is its betrayal.","at":"at 4:42:32 in the recording","th":["Disinformation and information integrity"]}],"2025_ISR":[{"e":"E00293","q":"Forward-looking Arabs and Muslim leaders know that cooperating with Israel will provide them with groundbreaking Israeli technologies, including in medicine and science, in agriculture and water, in defense and AI, and so many other fields.","at":"at 1:00:00 in the recording","th":["AI listed among technologies"]}],"2025_ITA":[{"e":"E00294","q":"As is happening with the opening of the AI hub for sustainable development, involving hundreds of African startups in the development of artificial intelligence.","at":"at 11:28:39 in the recording","th":["Capacity building and AI cooperation"]}],"2025_KAZ":[{"e":"E00295","q":"Kazakhstan views artificial intelligence not as one more technological advancement, but as a major breakthrough that can be a true engine of human progress.","at":"at 6:18:30 in the recording","th":["International AI rules and governance","Human rights, ethics and democracy","AI divide and equitable access","AI as both promise and peril","AI as epochal transformation"]},{"e":"E00296","q":"Kazakhstan welcomes the establishment under UN auspices of the Global Dialogue on AI Governance. We stand ready to actively contribute to this platform to help ensure that AI remains safe, inclusive, and human-centered.","at":"at 6:18:30 in the recording","th":["UN bodies and processes on AI","Jobs, labour and economic transformation","National AI strategy and achievements"]}],"2025_KEN":[{"e":"E00297","q":"We are building a climate-resilient society by embedding adaptation into every sector, from agriculture and energy to infrastructure and livelihoods, to sustainable mining and artificial intelligence.","at":"at 2:12:55 in the recording","th":[]}],"2025_KOR":[{"e":"E00298","q":"We will strive to ensure that the vision of AI for all, where advances in cutting-edge technology contribute to the universal values of humanity, becomes a new normal for the international community. AI-driven technological innovations will be an important new tool for solving global challenges like the climate crisis.","at":"at 4:20:55 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","AI divide and equitable access","AI for development and the SDGs","Jobs, labour and economic transformation","AI as both promise and peril"]}],"2025_LIE sformation","National AI strategy and achievements","AI as both promise and peril","AI as epochal transformation"]}],"2025_MKD":[{"e":"E00306","q":"urgent challenges such as peace and security, climate change and environmental destruction, artificial intelligence and growing inequalities","at":"at 1:28:41 in the recording","th":["AI listed among threats or crises"]},{"e":"E00307","q":"my country and I support the proposal to make artificial intelligence a priority of the 80th session.","at":"at 1:28:41 in the recording","th":["UN bodies and processes on AI","AI as both promise and peril","AI as epochal transformation"]}],"2025_MLT":[{"e":"E00308","q":"The United Nations must embrace digital diplomacy for the artificial intelligence age.","at":"at 3:24:06 in the recording","th":["UN bodies and processes on AI"]}],"2025_MNE":[{"e":"E00309","q":"Dear colleagues, rapid technological change, and particularly the rise of the artificial intelligence, must be harnessed in a safe, responsible, and inclusive manner.","at":"at 0:36:00 in the recording","th":[]},{"e":"E00310","q":"Technology should be an evolutionary gift to humanity, developed, founded, and guided with social responsibility, serving the greater good.","at":"at 0:36:00 in the recording","th":[]}],"2025_MOZ":[{"e":"E00311","q":"Artificial intelligence and other emerging technologies offer extraordinary opportunities, but also serious risks of exclusion, manipulation of the society, and even militarization throughout autonomous weapons.","at":"at 11:06:50 in the recording","th":["International AI rules and governance","Equal voice in AI rule-making","Military AI and autonomous weapons","Frontier AI safety and loss of control","AI divide and equitable access","Capacity building and AI cooperation","AI as both promise and peril"]}],"2025_MRT":[{"e":"E00312","q":"One is rapidly advancing toward the fourth industrial revolution and artificial intelligence, while the other remains hostage to poverty and marginalization.","at":"at 6:01:27 in the recording","th":["AI divide and equitable access"]},{"e":"E00313","q":"It requires us to unite our efforts to devise solutions that are capable of narrowing this gap by achieving just and comprehensive human-centered development and the right of every human to a dignified life.","at":"at 6:01:27 in the recording","th":[]}],"2025_MUS":[{"e":"E00314","q":"Persistent conflicts, climate emergencies, environmental degradation, growing inequalities, cyber criminality exacerbated by artificial intelligence.","at":"at 11:34:14 in the recording","th":["Cyber threats, crime and terrorist misuse"]},{"e":"E00315","q":"There is need to build a global governance architecture through multilateral negotiations that will ensure safe, secure, ethical, and inclusive use of AI.","at":"at 11:34:14 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","AI divide and equitable access","AI as both promise and peril"]}],"2025_MWI":[{"e":"E00316","q":"harness the transformative potential of science, technology, artificial intelligence, and private sector development for national and global development.","at":"transcript lines 165-165","th":["AI listed among technologies"]},{"e":"E00317","q":"We therefore call for a global framework that ensures AI is ethical, inclusive, and accessible to all nations","at":"transcript lines 165-165","th":["International AI rules and governance","AI divide and equitable access","AI for development and the SDGs","AI as both promise and peril"]},{"e":"E00318","q":"The Republic of Malawi is optimistic that AI will usher in a new era of enhanced productivity for its citizens, helping to propel the country's development trajectory.","at":"transcript lines 165-165","th":["AI for development and the SDGs","Jobs, labour and economic transformation"]}],"2025_NAM":[{"e":"E00319","q":"artificial intelligence must not be a substitute for human judgment or responsibility.","at":"at 7:24:08 in the recording","th":["International AI rules and governance","Human agency, control and accountability","Human rights, ethics and democracy"]}],"2025_NGA":[{"e":"E00320","q":"As our friend, the Secretary General, has said, AI must turn for Africa, included.","at":"at 10:28:44 in the recording","th":["AI divide and equitable access"]}],"2025_NLD":[{"e":"E00321","q":"So if we are to move forward, we must work together by using AI and other technologies wherever possible.","at":"at 8:13:31 in the recording","th":["UN bodies and processes on AI"]}],"2025_OMN":[{"e":"E00322","q":"We also place high importance on digital transformation, artificial intelligence applications, innovation, industrial development, and strengthening social protection, justice, and job security.","at":"at 8:00:00 in the recording","th":["AI listed among technologies"]}],"2025_PAK":[{"e":"E00323","q":"embraced digitization, AI, and crypto as the tools of the future.","at":"at 1:11:21 in the recording","th":["AI listed among technologies"]}],"2025_PHL":[{"e":"E00324","q":"Artificial intelligence offers promise, but carries profound risks. We must help build digital societies that bridges development divides rather than widen them, conforming with safeguards against misuse.","at":"at 9:19:55 in the recording","th":["AI divide and equitable access","AI as both promise and peril"]}],"2025_PRT":[{"e":"E00325","q":"It's a priority involving the digital, the space, the artificial intelligence technologies as force for peace, not tools for domination.","at":"at 5:29:14 in the recording","th":["AI as a tool for peace"]}],"2025_SAU":[{"e":"E00326","q":"The Kingdom also warns of the dangers of the military uses of artificial intelligence applications and autonomous weapons. and the need to enact international laws regulating them.","at":"at 7:21:34 in the recording","th":["Military AI and autonomous weapons"]}],"2025_SGP":[{"e":"E00327","q":"Early and constructive and inclusive multilateral engagement is essential, an

"q":"To tackle successfully the growing challenges of artificial intelligence.","at":"at 1:56:29 in the recording","th":["AI listed among threats or crises"]}],"2025_WSM":[{"e":"E00340","q":"The digital transformation, including AI and data analytics, offer real opportunities to drive an inclusive, just energy transition, particularly through off-grid solutions and smarter energy planning.","at":"at 10:00:00 in the recording","th":["AI for development and the SDGs"]}],"2025_ZWE":[{"e":"E00341","q":"The global dialogue on AI governance should assist all countries. We applaud the deliberate effort by the UN Secretary General towards optimizing the benefits of technology while minimizing the potential harmful effects of the same.","at":"at 10:11:27 in the recording","th":["UN bodies and processes on AI","AI for development and the SDGs","AI as both promise and peril"]}],"2026_AGO":[{"e":"E00342","q":"a champion of the global debate on global governance of artificial intelligence.","at":"at 6:12:21 in the recording","th":["UN bodies and processes on AI"]},{"e":"E00343","q":"The voice of Africans must be heard in all circumstances, at all times, in strategic decision-making processes on issues of peace, global security, financing for development as well as climate issues and global governance of artificial intelligence.","at":"at 6:12:21 in the recording","th":["Equal voice in AI rule-making"]},{"e":"E00344","q":"Today, peoples and nations have an opportunity to make a qualitative leap in their overall living conditions through fair financing mechanisms for development and tools provided by artificial intelligence in order to improve education, health, agriculture, public service, scientific research and economic productivity.","at":"at 6:12:21 in the recording","th":["International AI rules and governance","AI divide and equitable access","Capacity building and AI cooperation","AI for development and the SDGs"]}],"2026_ALB":[{"e":"E00345","q":"The greatest immediate danger is not that artificial intelligence will stop obeying humanity. The greatest danger is that it will obey the wrong human beings perfectly.","at":"at 4:42:52 in the recording","th":["Disinformation and information integrity","Jobs, labour and economic transformation","AI as epochal transformation"]},{"e":"E00346","q":"We can build artificial intelligence that teaches rather than merely answers, guides rather than commands, and strengthens the human being instead of making the human being dependent upon it.","at":"at 4:42:52 in the recording","th":["Human agency, control and accountability","Human rights, ethics and democracy","Disinformation and information integrity","National AI strategy and achievements"]},{"e":"E00347","q":"The algorithm did not invent the objective. A human actor did. The algorithm did not develop hatred. It discovered how to activate ours. This is systematic fraud as a service.","at":"at 4:42:52 in the recording","th":["Human rights, ethics and democracy","Disinformation and information integrity"]},{"e":"E00348","q":"Some respond by demanding that artificial intelligence be slowed or stopped.","at":"at 4:42:52 in the recording","th":["Human rights, ethics and democracy","Disinformation and information integrity"]},{"e":"E00349","q":"We need artificial intelligence that is verifiable, transparent, and accountable, built by free society, shared among allies, and placed in the service of citizens.","at":"at 4:42:52 in the recording","th":["International AI rules and governance","Scepticism of AI regulation and risk narratives","Human rights, ethics and democracy","Disinformation and information integrity","National AI strategy and achievements","Power concentration, dependence and sovereignty"]},{"e":"E00350","q":"Third, every consequential use of artificial intelligence by a public institution","at":"at 4:42:52 in the recording","th":["International AI rules and governance","Disinformation and information integrity"]},{"e":"E00351","q":"Fourth, democracies must create a shared early warning system so that evidence of artificial intelligence driven manipulation can travel between all like minded nations as quickly as the manipulation itself.","at":"at 5:00:00 in the recording","th":["International AI rules and governance","Human agency, control and accountability","Human rights, ethics and democracy","Disinformation and information integrity","Power concentration, dependence and sovereignty"]},{"e":"E00352","q":"We choose acceleration, no surrender. We choose innovation, no abdication. We choose augmentation, no atrophy of human capacity.","at":"at 5:00:00 in the recording","th":["Human rights, ethics and democracy","National AI strategy and achievements"]}],"2026_AND":[{"e":"E00353","q":"artificial intelligence represents one of the most profound transformations humanity has ever known. It opens extraordinary opportunities for scientific progress, medicine, education, and the fight against climate change.","at":"at 11:25:33 in the recording","th":["AI for development and the SDGs","AI as epochal transformation"]},{"e":"E00354","q":"We must ensure that artificial intelligence expands opportunities rather than inequalities, that it protects human rights rather than putting them at risk, that it strengthens our democracies rather than weakening them","at":"at 11:25:33 in the recording","th":["International AI rules and governance","Human rights, ethics and democracy","Bias, stereotypes and cultural diversity","AI divide and equitable access"]}],"2026_ARE":[{"e":"E00355","q":"The UAE continues to expand its investments in artificial intelligence, emerging technologies, healthcare, and education.","at":"at 3:30:16 in the recording","th":["National AI strategy and achievements"]}],"2026_ARG":[{"e":"E00356","q":"and third, its position in the face of the advent of artificial intelligence.","at":"at 2:20:54 in the recording","th":[]},{"e":"E00357","q":"And if for a moment we allow ourselves to believe that the g technology, including artificial intelligence, which is evolving at a furious pace","at":"at 10:49:44 in the recording","th":["AI listed among threats or crises"]},{"e":"E00364","q":"But leaders of AI companies themselves have warned of the potential risks to allow frontier AI to develop too fast without guardrails. Recently, an artificial intelligence agent infiltrated an Australian government website.","at":"at 11:00:00 in the recording","th":["International AI rules and governance","Frontier AI safety and loss of control","Cyber threats, crime and terrorist misuse","AI for development and the SDGs","National AI strategy and achievements","AI as both promise and peril"]}],"2026_AUT":[{"e":"E00365","q":"Who decides whether a human being or a machine pulls the trigger?","at":"at 11:42:27 in the recording","th":["Military AI and autonomous weapons"]},{"e":"E00366","q":"One of the most urgent threats today is the loss of human control over weapons.","at":"at 11:42:27 in the recording","th":["Military AI and autonomous weapons"]},{"e":"E00367","q":"With artificial intelligence, we can still act first. For this reason, Austria joins the UN Secretary General and the President of the ICRC in calling for a legally binding instrument with clear prohibitions and restrictions on autonomous weapons.","at":"at 11:42:27 in the recording","th":["Military AI and autonomous weapons"]},{"e":"E00368","q":"Neither should the fastest algorithm, nor should those with the most tanks or the deepest pockets.","at":"at 11:42:27 in the recording","th":["Human agency, control and accountability"]}],"2026_BEL":[{"e":"E00369","q":"I'm thinking in particular of children who are growing up in a world where AI can open extraordinary possibilities but also creates new vulnerabilities. We must neither hold back innovation out of fear, nor assume that it will regulate itself.","at":"at 11:37:39 in the recording","th":["International AI rules and governance","Protecting children from AI harms","AI as both promise and peril"]}],"2026_BEN":[{"e":"E00370","q":"AI is already transforming knowledge, work, our economies, education and information.","at":"at 6:41:35 in the recording","th":["AI as epochal transformation"]},{"e":"E00371","q":"Therefore, Benin is in favor of international AI governance that's inclusive, responsible, and development-oriented.","at":"at 6:41:35 in the recording","th":["International AI rules and governance","AI divide and equitable access","AI for development and the SDGs","Power concentration, dependence and sovereignty","AI as both promise and peril","AI as epochal transformation"]}],"2026_BGD":[{"e":"E00372","q":"We do not want today's digital divide to become tomorrow's artificial intelligence divide.","at":"at 9:30:26 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","AI divide and equitable access","Capacity building and AI cooperation"]}],"2026_BGR":[{"e":"E00373","q":"Artificial intelligence must be developed in keeping with international law and under effective human control, and outer space must remain the realm of peaceful and safe operations.","at":"at 5:34:02 in the recording","th":["Military AI and autonomous weapons"]}],"2026_BHR":[{"e":"E00374","q":"From this podium two years ago, His Royal Highness, the Crown Prince and Prime Minister, called for the adoption of an international treaty governing the development of artificial intelligence. It would ensure that this technology contributes to peace rather than exacerbating conflict.","at":"at 9:25:41 in the recording","th":["International AI rules and governance"]}],"2026_BHS":[{"e":"E00375","q":"It means building artificial intelligence that understands our languages and our lives, and not only the lives of those in the wealthy North, dominating languages and dominating cultures.","at":"at 6:25:11 in the recording","th":["Equal voice in AI rule-making","Bias, stereotypes and cultural diversity","Power concentration, dependence and sovereignty"]}],"2026_BLR":[{"e":"E00376","q":"The very fact that new international global initiatives are emerging outside the system, for example, Trump's Board of Peace or the World Artificial Intelligence Cooperation Organization, China's project, this confirms that the UN is failing to recognize new trends.","at":"at 5:14:01 in the recording","th":["UN bodies and processes on AI"]}],"2026_BLZ":[{"e":"E00377","q":"Artificial intelligence adds a further layer. Well-governed, it can widen access to knowledge and improve public services.","at":"at 0:54:09 in the recording","th":["AI for development and the SDGs"]},{"e":"E00378","q":"And we have a global dialogue under this organization on the governance of artificial intelligence.","at":"at 0:54:09 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","AI divide and equitable access","Jobs, labour and economic transformation","Power concentration, dependence and sovereignty"]},{"e":"E00379","q":"She's a serious presence in artificial intelligence and the other technologies that will shape this century, and she has said plainly, that she is ready to share that expertise and those resources with the wider international community.","at":"at 1:00:00 in the recording","th":[]}],"2026_BRA":[{"e":"E00380","q":"it would be an unforgivable historical omission not to address the challenge of regulating the big techs and artificial intelligence.","at":"at 1:20:40 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","Protecting children from AI harms","National AI strategy and achievements","Power concentration, dependence and sovereignty","AI as both promise and peril"]}],"2026_BRB":[{"e":"E00381","q":"Artificial intelligence is opening extraordinary possibilities in health, education, science, and productivity, while also creating new risk of exclusion, exploitation, surveillance, and the distortion of rtificial intelligence should also reflect the linguistic and cultural diversity of the world. Arab and African languages and communities should receive fair representation in data and models.","at":"at 7:40:31 in the recording","th":["International AI rules and governance","UN bodies and processes on AI","Human rights, ethics and democracy","Bias, stereotypes and cultural diversity","AI divide and equitable access","Capacity building and AI cooperation","National AI strategy and achievements","Power concentration, dependence and sovereignty","AI as both promise and peril"]}],"2026_ESP":[{"e":"E00418","q":"We must impose strict regulations on the tech oligarchs who control the functioning of social networks and the development of artificial intelligence.","at":"at 11:09:09 in the recording","th":["Power concentration, dependence and sovereignty"]}],"2026_EST":[{"e":"E00419","q":"Like any new technology, AI poses risks and brings challenges. But with knowledge, wisdom and unity, we can put it to use in the service of humanity.","at":"at 2:41:27 in the recording","th":["AI as both promise and peril"]},{"e":"E00420","q":"As a co-chair of the first UN Global Dialogue on AI Governance, alongside with El Salvador, Estonia has proudly brought its knowledge and experience in service of the UN and its member states.","at":"at 2:41:27 in the recording","th":["UN bodies and processes on AI","AI divide and equitable access","Capacity building and AI cooperation","Youth, education and skills","National AI strategy and achievements"]},{"e":"E00421","q":"experience with around 150 other countries worldwide.","at":"at 3:00:00 in the recording","th":[]}],"2026_ETH":[{"e":"E00422","q":"I would like to thank the Secretary-General for placing before us the defining imperatives of our era, namely artificial intelligence, the climate crisis, and deepening global inequalities.","at":"at 6:28:34 in the recording","th":[]},{"e":"E00423","q":"Will the age of the AI become another instrument :"Support","k":false,"n":"Co-led the process that established the Panel."},{"y":2025,"c":"GBR","e":"E00280","m":"Dialogue","p":"Support","k":false,"n":"Welcomes the new Global Dialogue."},{"y":2025,"c":"GBR","e":"E00280","m":"Panel","p":"Support","k":false,"n":"Commends the new Panel."},{"y":2025,"c":"GRC","e":"E00284","m":"Dialogue","p":"Support","k":false,"n":"Welcomes the Dialogue."},{"y":2025,"c":"GRC","e":"E00284","m":"Panel","p":"Support","k":false,"n":"Welcomes the Panel."},{"y":2025,"c":"GUY","e":"E00288","m":"Dialogue","p":"Support","k":false,"n":"Welcomes both mechanisms."},{"y":2025,"c":"GUY","e":"E00288","m":"Panel","p":"Support","k":false,"n":"Welcomes both mechanisms."},{"y":2025,"c":"KAZ","e":"E00296","m":"Dialogue","p":"Support","k":true,"n":"Welcomes the Dialogue under UN auspices."},{"y":2025,"c":"MUS","e":"E00315","m":"Dialogue","p":"Support","k":false,"n":"Welcomes both mechanisms."},{"y":2025,"c":"MUS","e":"E00315","m":"Panel","p":"Support","k":false,"n":"Welcomes both mechanisms."},{"y":2025,"c":"SMR","e":"E00329","m":"Dialogue","p":"Support","k":false,"n":"Calls both mechanisms fundamental."},{"y":2025,"c":"SMR","e":"E00329","m":"Panel","p":"Support","k":false,"n":"Calls both mechanisms fundamental."},{"y":2025,"c":"ZWE","e":"E00341","m":"Dialogue","p":"Request","k":false,"n":"Asks that the Dialogue assist all countries."},{"y":2025,"c":"IND","e":"E00291","m":"Dialogue","p":"Excluded","k":false,"n":"India-hosted summit; not the UN Dialogue."},{"y":2024,"c":"SGP","e":"E00224","m":"Dialogue","p":"Request","k":false,"n":"Calls for a dialogue on global AI governance."},{"y":2024,"c":"ESP","e":"E00179","m":"Panel","p":"Excluded","k":false,"n":"Refers to the High-level Advisory Body recommendations; not the Panel."},{"y":2024,"c":"JPN","e":"E00196","m":"Dialogue","p":"Excluded","k":false,"n":"General UN discussions on AI."},{"y":2024,"c":"KOR","e":"E00199","m":"Dialogue","p":"Excluded","k":false,"n":"Seoul Summit declaration."},{"y":2023,"c":"SGP","e":"E00140","m":"Dialogue","p":"Request","k":false,"n":"Calls for an inclusive global dialogue at the UN."},{"y":2023,"c":"KOR","e":"E00120","m":"Dialogue","p":"Excluded","k":false,"n":"Korea-hosted global AI forum."},{"y":2021,"c":"AUT","e":"E00052","m":"Dialogue","p":"Excluded","k":false,"n":"National conference on autonomous weapons."}],"requests":[{"y":2023,"c":"KOR","e":"E00119","f":["dialogue/convening","norms/rules/standards"]},{"y":2023,"c":"SGP","e":"E00140","f":["dialogue/convening","monitoring/oversight/verification"]},{"y":2024,"c":"KAZ","e":"E00197","f":["coordination","norms/rules/standards"]},{"y":2024,"c":"PHL","e":"E00218","f":["norms/rules/standards"]},{"y":2024,"c":"SGP","e":"E00224","f":["dialogue/convening"]},{"y":2025,"c":"ZWE","e":"E00341","f":["other"]},{"y":2026,"c":"BGD","e":"E00372","f":["norms/rules/standards"]},{"y":2026,"c":"BWA","e":"E00387","f":["norms/rules/standards"]},{"y":2026,"c":"CAF","e":"E00388","f":["capacity building","norms/rules/standards"]},{"y":2026,"c":"CHL","e":"E00394","f":["dialogue/convening"]},{"y":2026,"c":"ITA","e":"E00452","f":["monitoring/oversight/verification","norms/rules/standards"]},{"y":2026,"c":"JAM","e":"E00454","f":["norms/rules/standards"]},{"y":2026,"c":"LAO","e":"E00464","f":["capacity building"]},{"y":2026,"c":"MCO","e":"E00477","f":["norms/rules/standards"]},{"y":2026,"c":"MWI","e":"E00492","f":["capacity building","norms/rules/standards"]},{"y":2026,"c":"SGP","e":"E00516","f":["dialogue/convening","norms/rules/standards"]},{"y":2026,"c":"SVK","e":"E00528","f":["norms/rules/standards"]},{"y":2026,"c":"TKM","e":"E00537","f":["norms/rules/standards"]},{"y":2026,"c":"TUR","e":"E00544","f":["norms/rules/standards"]}],"models":[{"y":2026,"c":"SGP","e":"E00516","cat":"Treaty or convention","p":"UN framework convention on AI safeguards; ITU standards and an IAEA-style verification body"},{"y":2026,"c":"DEU","e":"E00412","cat":"Safety or verification regime","p":"Common safety requirements: testing before rnational body","p":"International cooperation mechanism"},{"y":2024,"c":"BRA","e":"E00164","cat":"New international body","p":"Intergovernmental AI governance system"},{"y":2024,"c":"COL","e":"E00171","cat":"New international body","p":"Global public authority"},{"y":2024,"c":"GRC","e":"E00189","cat":"Treaty or convention","p":"Conference of the parties for AI"},{"y":2024,"c":"KAZ","e":"E00197","cat":"New international body","p":"UN AI office"},{"y":2023,"c":"ATG","e":"E00070","cat":"Treaty or convention","p":"Treaty on lethal autonomous weapons"},{"y":2023,"c":"ESP","e":"E00083","cat":"New international body","p":"Host an international AI agency"},{"y":2023,"c":"KOR","e":"E00119","cat":"New international body","p":"International organisation under the UN"},{"y":2022,"c":"LKA","e":"E00065","cat":"Safety or verification regime","p":"Regulatory supervisory regime"},{"y":2022,"c":"PHL","e":"E00067","cat":"Treaty or convention","p":"Legal rules against weaponisation"},{"y":2021,"c":"AUT","e":"E00052","cat":"Treaty or convention","p":"Ban on killer robots"}],"venues":[{"y":2026,"c":"GBR","e":"E00436","v":"G20"},{"y":2026,"c":"LTU","e":"E00473","v":"Council of Europe Vilnius Convention"},{"y":2026,"c":"JPN","e":"E00455","v":"Hiroshima AI Process"},{"y":2026,"c":"JPN","e":"E00456","v":"Japan-hosted AI summit"},{"y":2026,"c":"IND","e":"E00447","v":"AI Impact Summit"},{"y":2026,"c":"BLR","e":"E00376","v":"China's World AI Cooperation Organization"},{"y":2026,"c":"CHE","e":"E00392","v":"Geneva AI Summit"},{"y":2026,"c":"FRA","e":"E00428","v":"AI summit series"},{"y":2026,"c":"FRA","e":"E00430","v":"G7"}],"implications":[{"addressee":"Secretary-General and the UN","title":"Frame AI messaging around universal participation and practical capacity","text":"Common rules and a role for the UN are the most frequent themes, and many speakers tie them to an equal voice for all countries in rule-making. Messaging should link global rules to concrete capacity support.","link":{"tab":"themes","theme":"Common rules"}},{"addressee":"Secretary-General and the UN","title":"Route military AI demands to disarmament processes","text":"Calls on autonomous weapons and military AI fall outside the non-military Panel and Dialogue. Reference the appropriate disarmament processes in Secretary-General messaging.","link":{"tab":"themes","theme":"Security"}},{"addressee":"SPMU","title":"Engage sceptical delegations directly","text":"A small group of addresses questions regulation or global approaches to AI. Engage these delegations directly rather than presuming consensus.","link":{"tab":"themes","theme":"Counter-current"}},{"addressee":"SPMU","title":"Track competing institutional models","text":"Proposals range from a UN convention to safety and verification regimes, new bodies and venues outside the UN. Track convergence and unresolved differences across these models.","link":{"tab":"un","mechanism":"Models"}},{"addressee":"Tech Envoy","title":"Give the proposed Global Fund a clear financing path","text":"Digital-divide and capacity concerns cluster together, yet explicit support for the proposed Fund is rare. Link the Fund to national AI strategy support and keep general capacity calls distinct from Fund endorsement.","link":{"tab":"un","mechanism":"Fund"}},{"addressee":"Scientific Panel","title":"Cover language, resource footprint and concentration in assessments","text":"Speakers raised language representation, the resource footprint of AI and the concentration of computing, data and patents. Consider these gaps in forthcoming assessments.","link":{"tab":"un","mechanism":"Panel"}},{"addressee":"Global Dialogue","title":"Prepare concrete deliverables for the next session","text":"Supporters of the Dialogue sit alongside a reservation that dialogue creates no obligations, while others ask for common safety requirements, testing and incident reporting. Shared testing and incident-reporting practices are candidate deliverables.","link":{"tab":"un","mechanism":"Dialogue"}}],"pendingToNo":1303}</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('ux-data').textContent);
const root=document.getElementById('unga-explorer'),$=s=>root.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL='All groups',MIN_N=20,LAST=D.years[D.years.length-1];
const MECH={Dialogue:'Global Dialogue on AI Governance',Panel:'Independent International Scientific Panel on AI',Fund:'Proposed Global Fund for AI Capacity-Building',Models:'Institutional models'};
const TILE={Dialogue:'AI Dialogue',Panel:'Scientific Panel',Fund:'Proposed Global Fund',Models:'Institutional models'};
const byYear={};D.records.forEach(r=>{(byYear[r.y]??={})[r.c]=r;});
const members=Object.keys(D.countries).sort((a,b)=>D.countries[a].name.localeCompare(D.countries[b].name));
const cname=c=>D.countries[c]?.name??c,ti=t=>D.themes.indexOf(t);
let state={year:LAST,group:ALL,tab:'facts',country:null,theme:null,pair:null,mechanism:null,show:'ai'};

// Rates: below MIN_N the denominator is too small for a percentage, so counts are shown instead.
const pct=(k,d)=>d?`${Math.round(100*k/d)}%`:'—';
const rate=(k,d)=>!d?'—':d<MIN_N?`${k} of ${d}`:`${pct(k,d)}`;
const frac=(k,d)=>!d?'—':d<MIN_N?`${k} of ${d}`:`${k}/${d} · ${pct(k,d)}`;
const inGroup=(c,g=state.group)=>g===ALL||D.countries[c].group===g;
const scoped=(y=state.year,g=state.group)=>members.filter(c=>inGroup(c,g)).map(c=>({c,r:byYear[y]?.[c]??null}));
function stats(y=state.year,g=state.group){const rs=scoped(y,g),valid=rs.filter(x=>x.r),ai=valid.filter(x=>x.r.ai);return{rs,valid,ai,n:ai.length,d:valid.length,missing:rs.length-valid.length};}
// Theme share among AI-referencing statements whose group value is resolved (not blank).
function themeShare(list,t){const i=ti(t),res=list.filter(x=>x.r.t[i]!==null);return{k:res.filter(x=>x.r.t[i]===1).length,d:res.length};}
const has=(x,t)=>x.r&&x.r.t[ti(t)]===1;

const pos=(y=state.year,g=state.group)=>D.positions.filter(p=>p.y===y&&inGroup(p.c,g));
const models=(y=state.year,g=state.group)=>D.models.filter(p=>p.y===y&&inGroup(p.c,g));
const venues=(y=state.year,g=state.group)=>D.venues.filter(p=>p.y===y&&inGroup(p.c,g));
const reqs=(y=state.year,g=state.group)=>D.requests.filter(p=>p.y===y&&inGroup(p.c,g));
function mechCountries(m,y=state.year,g=state.group){return new Set(m==='Models'?models(y,g).map(p=>p.c):pos(y,g).filter(p=>p.m===m&&p.p!=='Excluded').map(p=>p.c));}
const supporters=(m,y=state.year,g=state.group)=>new Set(pos(y,g).filter(p=>p.m===m&&p.p==='Support').map(p=>p.c));

function lineChart(){const vals=D.years.map(y=>{const s=stats(y);return{s,y,v:s.d?s.n/s.d*100:0}});const W=500,H=165,L=36,R=12,T=12,B=25,x=i=>L+i*(W-L-R)/(D.years.length-1),y=v=>H-B-v*(H-T-B)/100;
return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of statements referring to AI by year"><text x="${L}" y="10" font-size="10" fill="var(--sub)">Statements referring to AI (%)</text>${[0,50,100].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text>`).join('')}<polyline points="${vals.map((v,i)=>`${x(i)},${y(v.v)}`).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.v)}" r="${v.y===state.year?6:3}" fill="var(--blue)"/><text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--sub)">${v.y}</text>`).join('')}</svg></div><div class="yearstrip" aria-label="Select year">${vals.map(v=>`<button data-year="${v.y}" aria-pressed="${v.y===state.year}" aria-label="${v.y}: ${v.s.n} of ${v.s.d} statements">${String(v.y).slice(2)} · ${v.s.n}</button>`).join('')}</div>`;}

function facts(){const s=stats();return `<h2>Who is talking about AI?</h2><div class="muted">${state.year} · ${esc(state.group)}</div><div class="stats"><div class="stat"><div class="muted">AI references</div><div class="number">${s.n}</div><div class="muted">countries</div></div><div class="stat"><div class="muted">Year total</div><div class="number">${s.d}</div><div class="muted">statements obtained</div></div><div class="stat"><div class="muted">Reference rate</div><div class="number">${rate(s.n,s.d)}</div><div class="muted">${s.n} / ${s.d} countries</div></div></div><div class="muted">${s.missing?`${s.missing} Member State${s.missing===1?'':'s'} without an obtained statement, excluded from the year total.`:'Statements obtained for every Member State in scope.'}</div><section class="panel"><div class="rowhead"><h3>AI references over time</h3><span class="tag neutral">${esc(state.group)}</span></div>${lineChart()}<div class="muted">Select a year to update the analysis below. Buttons show the number of countries referring to AI.</div></section><section class="panel"><div class="rowhead"><h3>Regional groups · ${state.year}</h3>${state.group!==ALL?'<button data-resetgroup class="link">Show all</button>':''}</div><div class="tablewrap"><table><thead><tr><th>Regional group</th><th class="num">Year total</th><th class="num">AI</th><th class="num">Rate</th><th class="num">YoY pp</th></tr></thead><tbody>${D.groups.map(g=>{const a=stats(state.year,g),b=stats(state.year-1,g),delta=(state.year===D.years[0]||!a.d||!b.d)?'—':((a.n/a.d-b.n/b.d)*100).toFixed(1);return `<tr class="${state.group===g?'selected':''}"><td><button class="link" data-group="${esc(g)}" aria-pressed="${state.group===g}">${esc(g)}</button></td><td class="num">${a.d}</td><td class="num">${a.n}</td><td class="num">${rate(a.n,a.d)}</td><td class="num">${delta!=='—'&&Number(delta)>0?'+':''}${delta}</td></tr>`}).join('')}</tbody></table></div><div class="muted">The United States is counted in the Western European and other States group. YoY = percentage-point change from the previous year.</div></section>`;}

function themeBar(t,k,d,attr,pressed,extra=''){return `<button class="barbutton" ${attr}="${esc(t)}" aria-pressed="${pressed}" title="${esc(D.themeCodes[t].join('; '))}"><span>${esc(t)}</span><span class="track"><span class="fill" style="display:block;width:${d?k/d*100:0}%"></span></span><span>${frac(k,d)}</span></button>${extra}`;}
function themesView(){const a=stats().ai,cond=state.theme||D.themes[0],base=a.filter(x=>has(x,cond));
return `<h2>What do countries emphasize?</h2><div class="muted">${state.year} · ${esc(state.group)} · ${a.length} AI-referencing statements</div><section class="panel"><h3>Theme prevalence</h3>${D.themes.map(t=>{const s=themeShare(a,t);return themeBar(t,s.k,s.d,'data-theme',state.theme===t)}).join('')}<div class="muted">Share of AI-referencing statements whose coding for that theme is settled; statements where the two coding passes disagreed are left out of that theme's denominator. Statements can raise several themes. Below ${MIN_N} statements, counts are shown instead of percentages. Hover a theme to see the codes it groups.</div></section><section class="panel"><h3>What else do these countries discuss?</h3><p class="muted">Among statements raising <strong>${esc(cond)}</strong> (${base.length}), select a second theme.</p>${D.themes.filter(t=>t!==cond).map(t=>{const s=themeShare(base,t),o=themeShare(a,t);return themeBar(t,s.k,s.d,'data-pair',state.pair===t,`<div class="muted" style="text-align:right">Overall: ${rate(o.k,o.d)}</div>`)}).join('')}<p class="muted">Same annual statement; not necessarily an explicit connection between issues.</p></section><section class="panel"><h3>Emphasis across years</h3><div class="tablewrap"><table class="heat"><thead><tr><th>Theme</th>${D.years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${D.themes.map(t=>`<tr><th>${esc(t)}</th>${D.years.map(y=>{const s=themeShare(stats(y).ai,t),p=s.d?s.k/s.d:0;return `<td><button data-heatyear="${y}" data-heattheme="${esc(t)}" aria-label="${esc(t)}, ${y}: ${s.k} of ${s.d}" style="background:color-mix(in srgb,var(--blue) ${Math.round(p*45)}%,var(--surface))">${s.d<MIN_N?`${s.k}/${s.d}`:pct(s.k,s.d)}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="muted">Common taxonomy across years. Cells with fewer than ${MIN_N} statements show counts (k/n). Click a cell to list its countries.</div></section>`;}

function quoteBlock(e){const q=D.quotes[e];return q?`<div class="quote">${esc(q.q)}<span class="muted">${esc(e)}${q.at?' · '+esc(q.at):''}</span></div>`:'';}
function unView(){const ps=pos(),m=state.mechanism,ms=models(),vs=venues(),rq=reqs();
const tiles=['Dialogue','Panel','Fund','Models'].map(k=>`<button data-mechanism="${k}" aria-pressed="${m===k}"><span>${TILE[k]}<br><span class="muted">${k==='Models'?'countries proposing':'countries supporting'}</span></span><strong>${k==='Models'?mechCountries('Models').size:supporters(k).size}</strong></button>`).join('');
const shown=ps.filter(p=>p.p!=='Excluded'&&(!m||p.m===m)),excluded=ps.filter(p=>p.p==='Excluded'&&(!m||p.m===m));
const posTable=m==='Models'?'':`<section class="panel"><h3>${m?esc(MECH[m]):'Positions on UN AI mechanisms'}</h3><div class="tablewrap"><table><thead><tr><th>Country / mechanism</th><th>Position</th><th>Basis</th></tr></thead><tbody>${shown.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button><div class="muted">${TILE[p.m]}</div></td><td><span class="tag${p.p==='Support'?'':' neutral'}">${p.p}</span>${p.k?'<span class="tag">Commitment</span>':''}</td><td>${esc(p.n)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')||`<tr><td colspan="3" class="empty">No references to ${m?esc(MECH[m]):'these mechanisms'} in this selection.</td></tr>`}</tbody></table></div>${excluded.length?`<details><summary>${excluded.length} reference${excluded.length===1?'':'s'} not counted</summary><table><tbody>${excluded.map(p=>`<tr><td>${esc(cname(p.c))}<div class="muted">${TILE[p.m]} · ${p.e}</div></td><td>${esc(p.n)}</td></tr>`).join('')}</tbody></table></details>`:''}</section>`;
const modelTable=(!m||m==='Models')?`<section class="panel"><h3>Institutional models proposed</h3><div class="tablewrap"><table><thead><tr><th>Country</th><th>Model</th><th>Proposal</th></tr></thead><tbody>${ms.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td><span class="tag neutral">${esc(p.cat)}</span></td><td>${esc(p.p)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No institutional models proposed in this selection.</td></tr>'}</tbody></table></div>${vs.length?`<h3 style="margin-top:16px">Venues outside the UN</h3><div class="tablewrap"><table><tbody>${vs.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td>${esc(p.v)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')}</tbody></table></div>`:''}</section>`:'';
const reqTable=!m?`<section class="panel"><h3>Requests to the UN</h3><div class="tablewrap"><table><thead><tr><th>Country</th><th>What is asked</th></tr></thead><tbody>${rq.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td>${p.f.map(f=>`<span class="tag neutral">${esc(f)}</span>`).join('')}${quoteBlock(p.e)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No explicit requests to the UN in this selection.</td></tr>'}</tbody></table></div></section>`:'';
return `<h2>What role is proposed for the UN?</h2><div class="muted">Explicit references and positions · ${state.year} · ${esc(state.group)}</div><section class="panel"><div class="tilegrid">${tiles}</div><p class="muted">A supporter names or clearly refers to the specific UN mechanism and supports, welcomes or commits to it. A mention is not an endorsement, and general capacity-building calls are not Fund support.</p></section>${posTable}${modelTable}${reqTable}`;}

function implications(){let last=null;return `<h2>From evidence to action</h2><div class="muted">Analyst recommendations · Fixed scope: ${LAST}, all groups</div><section class="panel"><p class="muted">These recommendations do not change with the filters. Each links to the view holding its supporting statements.</p>${D.implications.map((v,i)=>{const head=v.addressee!==last?`<div class="eyebrow addressee">${esc(v.addressee)}</div>`:'';last=v.addressee;return `${head}<article class="recommend"><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p><button class="link" data-evidence="${i}">Supporting statements →</button></article>`}).join('')}</section>`;}

function matching(){return scoped().filter(x=>(state.show==='all'||x.r?.ai)&&(!state.theme||has(x,state.theme))&&(!state.pair||has(x,state.pair))&&(!state.mechanism||mechCountries(state.mechanism).has(x.c)));}
function list(){const a=matching(),rq=new Set(reqs().map(p=>p.c));$('#ux-listcontext').textContent=`${state.year} · ${state.group} · Select a country for its statement details`;
$('#ux-activefilter').innerHTML=[state.theme,state.pair,state.mechanism&&TILE[state.mechanism]].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+((state.theme||state.mechanism)?'<button class="link" data-clearfilters>Clear topic filters</button>':'');
$('#ux-countryrows').innerHTML=a.map(x=>{const ts=x.r?.ai?D.themes.filter((t,i)=>x.r.t[i]===1):[];return `<tr class="${x.c===state.country?'selected':''}"><td><button class="link" data-country="${x.c}" aria-pressed="${x.c===state.country}">${esc(cname(x.c))}</button></td><td>${!x.r?'Unavailable':x.r.ai?'Yes':'No'}</td><td>${ts.length?ts.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+(ts.length>2?`<span class="muted">+${ts.length-2}</span>`:''):'—'}</td><td>${!x.r?'—':rq.has(x.c)?'Yes':'None'}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No countries match this selection. Clear topic filters or choose another year.</td></tr>';
$('#ux-liststatus').textContent=`${a.length} countr${a.length===1?'y':'ies'} shown`;}

function detail(){const c=state.country;if(!c){$('#ux-detail').innerHTML='<div class="eyebrow">Statement details</div><h2>Select a country</h2><p class="muted">Choose a country from any section to see its themes, institutional positions and source evidence here.</p>';return;}
const r=byYear[state.year]?.[c],m=r&&D.meta[r.id],ev=(r&&D.evidence[r.id])||[],y=state.year;
const my=(arr)=>arr.filter(p=>p.y===y&&p.c===c);
const ts=r?.ai?D.themes.filter((t,i)=>r.t[i]===1):[],open=r?.ai?D.themes.filter((t,i)=>r.t[i]===null):[];
const speaker=m?[m.speaker,m.title].filter(Boolean).join(', ')+(m.date?` · ${m.date}`:''):'';
const inst=[...my(D.positions).map(p=>`<details><summary>${TILE[p.m]} · ${p.p==='Excluded'?'not counted':p.p}${p.k?' + Commitment':''}</summary><p>${esc(p.n)}</p>${quoteBlock(p.e)}</details>`),...my(D.models).map(p=>`<details><summary>Institutional model · ${esc(p.cat)}</summary><p>${esc(p.p)}</p>${quoteBlock(p.e)}</details>`),...my(D.venues).map(p=>`<details><summary>Venue outside the UN · ${esc(p.v)}</summary>${quoteBlock(p.e)}</details>`)];
$('#ux-detail').innerHTML=`<div class="rowhead"><div class="eyebrow">Statement details</div><button class="link" data-close aria-label="Close country details">Close</button></div><h2>${esc(cname(c))}</h2><div class="muted">${esc(D.countries[c].group)} · ${y}</div>
<section><h3>AI statement summary</h3><p>${!r?'No statement was obtained for this year.':r.ai?`Refers to AI in ${ev.length} coded passage${ev.length===1?'':'s'}.`:'No reference to AI found in this statement.'}</p>${speaker?`<div class="muted">${esc(speaker)}</div>`:''}${m?.override?`<div class="note">Status settled for the dashboard: ${esc(m.override)}</div>`:''}</section>
<section><h3>Themes</h3>${ts.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||`<p class="muted">${r?.ai?'No theme confirmed.':'—'}</p>`}${open.length?`<p class="muted">Coding not settled: ${open.map(esc).join(', ')}.</p>`:''}${ev.length?`<details><summary>View AI passages (${ev.length})</summary>${ev.map(e=>`<div class="quote">${esc(e.q)}<span class="muted">${e.th.length?esc(e.th.join('; '))+' · ':''}${esc(e.at)}</span></div>`).join('')}</details>`:''}</section>
<section><h3>Requests to the UN</h3>${my(D.requests).map(p=>`<p>${p.f.map(f=>`<span class="tag neutral">${esc(f)}</span>`).join('')}</p>${quoteBlock(p.e)}`).join('')||`<p class="muted">${r?'No explicit request to the UN.':'—'}</p>`}</section>
<section><h3>Institutional positions</h3>${inst.join('')||`<p class="muted">${r?'No references to UN mechanisms or institutional models.':'—'}</p>`}</section>
<section><h3>Source statement</h3>${m?`<p class="muted">${esc(m.type)}${m.record?` · ${esc(m.record)}`:''}</p><p>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${m.record?'Official record':'Transcript'}</a>`:''}${m.audio?` · <a href="${esc(m.audio)}" target="_blank" rel="noopener">UN Web TV</a>`:''}</p>`:'<p class="muted">No source statement for this year.</p>'}</section>
<section><h3>This country across years</h3><div class="history">${D.years.map(yy=>{const q=byYear[yy]?.[c];return `<button data-countryyear="${yy}" aria-pressed="${yy===y}" aria-label="${yy}, ${!q?'unavailable':q.ai?'AI referenced':'no AI reference'}">${String(yy).slice(2)} ${!q?'?':q.ai?'●':'–'}</button>`}).join('')}</div><p class="muted">● AI reference · – No reference · ? Unavailable</p></section>`;}

function render(){const a=matching();if(state.country&&!a.some(x=>x.c===state.country)&&!scoped().some(x=>x.c===state.country))state.country=a[0]?.c??null;$('#ux-year').value=state.year;$('#ux-group').value=state.group;$('#ux-show').value=state.show;$('#ux-scope').textContent=`${state.year} / ${state.group}`;root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab));$('#ux-view').innerHTML=({facts,themes:themesView,un:unView,implications})[state.tab]();$('#ux-countries').hidden=state.tab==='implications';list();detail();}

$('#ux-run').innerHTML=`Analysis run ${esc(D.run)}<br>${D.years[0]}–${LAST}`;
$('#ux-method').innerHTML=`<p>General Debate only: one principal statement per Member State per year. Year totals count statements obtained; Member States without an obtained statement are listed as unavailable and left out of rates. Regional groups follow the UN's five groups; the United States, which belongs to no group, is counted with Western European and other States.</p><p><strong>AI references.</strong> Statements where the keyword search found no AI term are counted as No (${D.pendingToNo} statements). Statements with a keyword hit were read in full. Seven statements the review left undecided were settled for this dashboard: three that name artificial intelligence in a list count as Yes; four that only mention machines, robots or algorithms count as No.</p><p><strong>Themes.</strong> The 26 codes of the analysis taxonomy are grouped into ${D.themes.length} themes. A theme is counted when any of its codes applies. When the two independent coding passes disagreed and no code applies, the theme is left blank and out of the denominator.</p><p><strong>Role of UN.</strong> Each reference to the Global Dialogue, the Scientific Panel or the proposed Fund was checked against its full quote. Only statements that name or clearly refer to the mechanism and support, welcome or commit to it count as support; mentions, requests, reservations and commitments are kept distinct. References that are not to the UN mechanism are listed as not counted. Institutional models and venues outside the UN are a curated list with source quotes.</p><p><strong>Sources.</strong> 2017–2024: official verbatim records (PDF page and paragraph). 2025–2026: automatic transcripts (unofficial), located by time in the UN Web TV recording.</p>`;
$('#ux-year').innerHTML=[...D.years].reverse().map(y=>`<option value="${y}">${y} · UNGA${y-1945}</option>`).join('');$('#ux-group').innerHTML=[ALL,...D.groups].map(g=>`<option>${esc(g)}</option>`).join('');
$('#ux-year').addEventListener('change',e=>{state.year=Number(e.target.value);render()});$('#ux-group').addEventListener('change',e=>{state.group=e.target.value;state.country=null;render()});$('#ux-show').addEventListener('change',e=>{state.show=e.target.value;render()});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.tab){state.tab=d.tab;state.theme=null;state.pair=null;state.mechanism=null;}
else if(d.group){state.group=d.group;state.country=null;}
else if('resetgroup'in d){state.group=ALL;}
else if(d.year){state.year=+d.year;}
else if(d.country){state.country=d.country;if(!matching().some(x=>x.c===d.country))state.show='all';render();if(root.clientWidth<680)$('#ux-detail').scrollIntoView({block:'start',behavior:'auto'});return;}
else if('close'in d){state.country=null;detail();return;}
else if(d.theme){state.theme=state.theme===d.theme?null:d.theme;state.pair=null;}
else if(d.pair){state.theme=state.theme||D.themes[0];state.pair=state.pair===d.pair?null:d.pair;}
else if(d.mechanism){state.mechanism=state.mechanism===d.mechanism?null:d.mechanism;}
else if('clearfilters'in d){state.theme=null;state.pair=null;state.mechanism=null;}
else if(d.heatyear){state.year=+d.heatyear;state.theme=d.heattheme;state.pair=null;}
else if(d.countryyear){state.year=+d.countryyear;state.show='all';state.theme=null;state.pair=null;state.mechanism=null;}
else if('evidence'in d){const l=D.implications[+d.evidence].link;state.tab=l.tab;state.year=LAST;state.group=ALL;state.theme=l.theme??null;state.pair=null;state.mechanism=l.mechanism??null;}
else return;render();});
state.country=stats().ai[0]?.c??null;render();
})();
</script>
</body>
</html>

<div id="unga-explorer">
<style>
#unga-explorer{--paper:light-dark(#f2f5f8,#151c25);--surface:light-dark(#fff,#1c2734);--ink:light-dark(#182f46,#e5edf5);--sub:light-dark(#566b7d,#aec0d0);--line:light-dark(#d8e2eb,#354656);--blue:light-dark(#086ea6,#74c5f1);--soft:light-dark(#e8f3fa,#233e50);--warn:light-dark(#765a14,#efce83);--wash:light-dark(#fff5d9,#3e3420);--thumb:light-dark(#a7b8c7,#697b8b);background:var(--paper);color:var(--ink);font:14px/1.5 'Segoe UI',Arial,sans-serif;border:1px solid var(--line);border-radius:12px;overflow:clip;color-scheme:light dark;text-align:left}
#unga-explorer *{box-sizing:border-box;scrollbar-color:var(--thumb) var(--paper);scrollbar-width:thin}#unga-explorer button,#unga-explorer select{font:inherit;color:inherit;cursor:pointer}#unga-explorer button{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-height:34px}#unga-explorer button:hover{background:var(--soft);border-color:var(--blue)}#unga-explorer button:focus-visible,#unga-explorer select:focus-visible,#unga-explorer summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}#unga-explorer button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}#unga-explorer h1{font:500 27px/1.2 'Trebuchet MS','Segoe UI',sans-serif;margin:4px 0 6px;letter-spacing:-.6px}#unga-explorer h2{font-size:18px;line-height:1.3;margin:0 0 5px;font-weight:600}#unga-explorer h3{font-size:14px;margin:0 0 10px;font-weight:600}#unga-explorer p{margin:5px 0 12px}#unga-explorer .muted{color:var(--sub);font-size:12px}#unga-explorer .eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);font-weight:600}#unga-explorer .top{padding:22px 26px 16px;background:var(--surface);display:flex;justify-content:space-between;gap:18px;align-items:center}#unga-explorer .wordmark{border-left:4px solid var(--blue);padding-left:14px}#unga-explorer .demo{background:var(--wash);color:var(--warn);font-size:12px;padding:9px 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}#unga-explorer .filters{padding:14px 26px;display:flex;align-items:end;gap:14px;flex-wrap:wrap;background:var(--surface)}#unga-explorer label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--sub)}#unga-explorer select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 30px 8px 10px;min-height:38px;max-width:100%}#unga-explorer .scope{margin-left:auto;text-align:right}#unga-explorer .nav{display:flex;gap:4px;padding:0 26px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}#unga-explorer .nav button{border:0;border-radius:0;padding:13px 12px;background:transparent;border-bottom:3px solid transparent;font-size:13px;color:var(--sub)}#unga-explorer .nav button[aria-pressed=true]{border-color:var(--blue);color:var(--blue);background:transparent}#unga-explorer .layout{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:18px;padding:22px}#unga-explorer .main{min-width:0}#unga-explorer .panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:16px}#unga-explorer .panel:first-child{margin-top:0}#unga-explorer .stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:17px 0;margin:16px 0;gap:0}#unga-explorer .stat{padding:0 16px;border-right:1px solid var(--line)}#unga-explorer .stat:last-child{border:0}#unga-explorer .number{font-size:29px;line-height:1.25;font-weight:600;font-variant-numeric:tabular-nums}#unga-explorer .stat .muted{font-size:11px}#unga-explorer .rowhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}#unga-explorer .rowhead h3{margin:0}#unga-explorer .chart{height:175px;position:relative}#unga-explorer .chart svg{width:100%;height:100%;overflow:visible}#unga-explorer .yearstrip{display:flex;justify-content:space-between;gap:2px;flex-wrap:wrap;margin-top:8px}#unga-explorer .yearstrip button{padding:3px 5px;font-size:11px;border-color:transparent;min-height:30px}#unga-explorer .tablewrap{overflow-x:auto}#unga-explorer table{width:100%;border-collapse:collapse;font-size:12px}#unga-explorer th{text-align:left;font-weight:500;color:var(--sub);padding:9px 6px;border-bottom:1px solid var(--line)}#unga-explorer td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}#unga-explorer tr:last-child td{border-bottom:0}#unga-explorer td.num,#unga-explorer th.num{text-align:right;font-variant-numeric:tabular-nums}#unga-explorer .link{border:0;padding:0;min-height:26px;background:transparent;color:var(--blue);text-align:left;font-weight:500}#unga-explorer .selected{background:var(--soft)}#unga-explorer .tag{display:inline-block;background:var(--soft);color:var(--blue);border-radius:4px;padding:3px 6px;font-size:11px;margin:2px 3px 2px 0}#unga-explorer .neutral{color:var(--sub);background:var(--paper)}#unga-explorer .detail{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:8px;padding:17px;align-self:start;min-width:0}#unga-explorer .detail h2{font-size:23px;margin-top:5px}#unga-explorer .detail section{border-top:1px solid var(--line);padding-top:14px;margin-top:15px}#unga-explorer .detail h3{margin-bottom:7px}#unga-explorer .detail p{font-size:12px}#unga-explorer .quote{border-left:2px solid var(--blue);padding:8px 10px;background:var(--soft);font-size:12px;margin:8px 0}#unga-explorer details{margin-top:10px}#unga-explorer summary{cursor:pointer;color:var(--blue);font-size:12px;padding:4px 0}#unga-explorer .barbutton{display:grid;grid-template-columns:120px 1fr 62px;width:100%;align-items:center;gap:10px;border:0;background:transparent;padding:8px 0;text-align:left;font-size:12px}#unga-explorer .track{height:9px;background:var(--paper);border-radius:2px;overflow:hidden}#unga-explorer .fill{height:100%;background:var(--blue)}#unga-explorer .barbutton[aria-pressed=true]{background:var(--soft);color:var(--ink);padding-left:5px;padding-right:5px}#unga-explorer .tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}#unga-explorer .tilegrid button{text-align:left;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}#unga-explorer .tilegrid strong{font-size:23px;font-weight:500}#unga-explorer .heat{min-width:390px}#unga-explorer .heat td{padding:4px;text-align:center}#unga-explorer .heat button{width:100%;min-height:30px;border:0;font-size:11px;padding:2px}#unga-explorer .recommend{border-left:3px solid var(--blue);padding-left:14px;margin:20px 0}#unga-explorer .recommend p{font-size:13px}#unga-explorer .foot{padding:16px 26px;background:var(--surface);border-top:1px solid var(--line)}#unga-explorer .empty{padding:20px 0;color:var(--sub)}#unga-explorer [hidden]{display:none!important}#unga-explorer .statusline{min-height:18px}#unga-explorer .history{display:flex;flex-wrap:wrap;gap:4px}#unga-explorer .history button{font-size:11px;padding:4px 6px}#unga-explorer .themefilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}#unga-explorer .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#unga-explorer{max-width:1280px;margin:0 auto}#unga-explorer .barbutton{grid-template-columns:150px 1fr 110px}#unga-explorer .barbutton>span:last-child{white-space:nowrap;text-align:right}#unga-explorer .tag.off{color:var(--sub);background:var(--paper);text-decoration:line-through}#unga-explorer .quote .muted{display:block;margin-top:4px}#unga-explorer .note{background:var(--wash);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px;margin:8px 0}#unga-explorer .heat{min-width:720px}#unga-explorer .heat th{white-space:nowrap}#unga-explorer .addressee{margin-top:22px}#unga-explorer .addressee:first-of-type{margin-top:8px}#unga-explorer a{color:var(--blue)}#unga-explorer .circle-open{fill:var(--surface);stroke:var(--blue);stroke-width:2}
</style>
<header class="top"><div class="wordmark"><div class="eyebrow">SPMU · General Debate</div><h1>AI at the General Assembly</h1><div class="muted">From national statements to institutional priorities</div></div><span class="muted" id="ux-run"></span></header>
<div class="filters"><label>Year<select id="ux-year"></select></label><label>UN regional group<select id="ux-group"></select></label><div class="scope"><strong id="ux-scope"></strong><div class="muted">One principal statement per country per year</div></div></div>
<nav class="nav" aria-label="Analysis sections"><button data-tab="facts" aria-pressed="true">Key Facts and Figures</button><button data-tab="themes" aria-pressed="false">Themes</button><button data-tab="un" aria-pressed="false">Role of UN</button><button data-tab="implications" aria-pressed="false">Implications</button></nav>
<div class="layout"><main class="main"><div id="ux-view"></div><section class="panel" id="ux-countries"><div class="rowhead"><h3>Explore countries</h3><label>Show<select id="ux-show"><option value="ai">AI references</option><option value="all">All Member States</option></select></label></div><div id="ux-listcontext" class="muted"></div><div id="ux-activefilter" class="themefilter"></div><div class="tablewrap"><table><thead><tr><th>Country</th><th>AI reference</th><th>Themes</th><th>UN request</th></tr></thead><tbody id="ux-countryrows"></tbody></table></div><p class="muted statusline" id="ux-liststatus" aria-live="polite"></p></section></main><aside class="detail" id="ux-detail" aria-label="Country statement details"></aside></div>
<footer class="foot"><details><summary>Methodology and coverage</summary><div class="muted" id="ux-method"></div></details></footer>
</div>
<script type="application/json" id="ux-data">__DASHBOARD_DATA__</script>
<script>
(()=>{
const D=JSON.parse(document.getElementById('ux-data').textContent);
const root=document.getElementById('unga-explorer'),$=s=>root.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ALL='All groups',MIN_N=20,LAST=D.years[D.years.length-1];
const MECH={Dialogue:'Global Dialogue on AI Governance',Panel:'Independent International Scientific Panel on AI',Fund:'Proposed Global Fund for AI Capacity-Building',Models:'Institutional models'};
const TILE={Dialogue:'AI Dialogue',Panel:'Scientific Panel',Fund:'Proposed Global Fund',Models:'Institutional models'};
const byYear={};D.records.forEach(r=>{(byYear[r.y]??={})[r.c]=r;});
const members=Object.keys(D.countries).sort((a,b)=>D.countries[a].name.localeCompare(D.countries[b].name));
const cname=c=>D.countries[c]?.name??c,ti=t=>D.themes.indexOf(t);
let state={year:LAST,group:ALL,tab:'facts',country:null,theme:null,pair:null,mechanism:null,show:'ai'};

// Rates: below MIN_N the denominator is too small for a percentage, so counts are shown instead.
const pct=(k,d)=>d?`${Math.round(100*k/d)}%`:'—';
const rate=(k,d)=>!d?'—':d<MIN_N?`${k} of ${d}`:`${pct(k,d)}`;
const frac=(k,d)=>!d?'—':d<MIN_N?`${k} of ${d}`:`${k}/${d} · ${pct(k,d)}`;
const inGroup=(c,g=state.group)=>g===ALL||D.countries[c].group===g;
const scoped=(y=state.year,g=state.group)=>members.filter(c=>inGroup(c,g)).map(c=>({c,r:byYear[y]?.[c]??null}));
function stats(y=state.year,g=state.group){const rs=scoped(y,g),valid=rs.filter(x=>x.r),ai=valid.filter(x=>x.r.ai);return{rs,valid,ai,n:ai.length,d:valid.length,missing:rs.length-valid.length};}
// Theme share among AI-referencing statements whose group value is resolved (not blank).
function themeShare(list,t){const i=ti(t),res=list.filter(x=>x.r.t[i]!==null);return{k:res.filter(x=>x.r.t[i]===1).length,d:res.length};}
const has=(x,t)=>x.r&&x.r.t[ti(t)]===1;

const pos=(y=state.year,g=state.group)=>D.positions.filter(p=>p.y===y&&inGroup(p.c,g));
const models=(y=state.year,g=state.group)=>D.models.filter(p=>p.y===y&&inGroup(p.c,g));
const venues=(y=state.year,g=state.group)=>D.venues.filter(p=>p.y===y&&inGroup(p.c,g));
const reqs=(y=state.year,g=state.group)=>D.requests.filter(p=>p.y===y&&inGroup(p.c,g));
function mechCountries(m,y=state.year,g=state.group){return new Set(m==='Models'?models(y,g).map(p=>p.c):pos(y,g).filter(p=>p.m===m&&p.p!=='Excluded').map(p=>p.c));}
const supporters=(m,y=state.year,g=state.group)=>new Set(pos(y,g).filter(p=>p.m===m&&p.p==='Support').map(p=>p.c));

function lineChart(){const vals=D.years.map(y=>{const s=stats(y);return{s,y,v:s.d?s.n/s.d*100:0}});const W=500,H=165,L=36,R=12,T=12,B=25,x=i=>L+i*(W-L-R)/(D.years.length-1),y=v=>H-B-v*(H-T-B)/100;
return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Share of statements referring to AI by year"><text x="${L}" y="10" font-size="10" fill="var(--sub)">Statements referring to AI (%)</text>${[0,50,100].map(v=>`<line x1="${L}" y1="${y(v)}" x2="${W-R}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-7}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--sub)">${v}</text>`).join('')}<polyline points="${vals.map((v,i)=>`${x(i)},${y(v.v)}`).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.v)}" r="${v.y===state.year?6:3}" fill="var(--blue)"/><text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--sub)">${v.y}</text>`).join('')}</svg></div><div class="yearstrip" aria-label="Select year">${vals.map(v=>`<button data-year="${v.y}" aria-pressed="${v.y===state.year}" aria-label="${v.y}: ${v.s.n} of ${v.s.d} statements">${String(v.y).slice(2)} · ${v.s.n}</button>`).join('')}</div>`;}

function facts(){const s=stats();return `<h2>Who is talking about AI?</h2><div class="muted">${state.year} · ${esc(state.group)}</div><div class="stats"><div class="stat"><div class="muted">AI references</div><div class="number">${s.n}</div><div class="muted">countries</div></div><div class="stat"><div class="muted">Year total</div><div class="number">${s.d}</div><div class="muted">statements obtained</div></div><div class="stat"><div class="muted">Reference rate</div><div class="number">${rate(s.n,s.d)}</div><div class="muted">${s.n} / ${s.d} countries</div></div></div><div class="muted">${s.missing?`${s.missing} Member State${s.missing===1?'':'s'} without an obtained statement, excluded from the year total.`:'Statements obtained for every Member State in scope.'}</div><section class="panel"><div class="rowhead"><h3>AI references over time</h3><span class="tag neutral">${esc(state.group)}</span></div>${lineChart()}<div class="muted">Select a year to update the analysis below. Buttons show the number of countries referring to AI.</div></section><section class="panel"><div class="rowhead"><h3>Regional groups · ${state.year}</h3>${state.group!==ALL?'<button data-resetgroup class="link">Show all</button>':''}</div><div class="tablewrap"><table><thead><tr><th>Regional group</th><th class="num">Year total</th><th class="num">AI</th><th class="num">Rate</th><th class="num">YoY pp</th></tr></thead><tbody>${D.groups.map(g=>{const a=stats(state.year,g),b=stats(state.year-1,g),delta=(state.year===D.years[0]||!a.d||!b.d)?'—':((a.n/a.d-b.n/b.d)*100).toFixed(1);return `<tr class="${state.group===g?'selected':''}"><td><button class="link" data-group="${esc(g)}" aria-pressed="${state.group===g}">${esc(g)}</button></td><td class="num">${a.d}</td><td class="num">${a.n}</td><td class="num">${rate(a.n,a.d)}</td><td class="num">${delta!=='—'&&Number(delta)>0?'+':''}${delta}</td></tr>`}).join('')}</tbody></table></div><div class="muted">The United States is counted in the Western European and other States group. YoY = percentage-point change from the previous year.</div></section>`;}

function themeBar(t,k,d,attr,pressed,extra=''){return `<button class="barbutton" ${attr}="${esc(t)}" aria-pressed="${pressed}" title="${esc(D.themeCodes[t].join('; '))}"><span>${esc(t)}</span><span class="track"><span class="fill" style="display:block;width:${d?k/d*100:0}%"></span></span><span>${frac(k,d)}</span></button>${extra}`;}
function themesView(){const a=stats().ai,cond=state.theme||D.themes[0],base=a.filter(x=>has(x,cond));
return `<h2>What do countries emphasize?</h2><div class="muted">${state.year} · ${esc(state.group)} · ${a.length} AI-referencing statements</div><section class="panel"><h3>Theme prevalence</h3>${D.themes.map(t=>{const s=themeShare(a,t);return themeBar(t,s.k,s.d,'data-theme',state.theme===t)}).join('')}<div class="muted">Share of AI-referencing statements whose coding for that theme is settled; statements where the two coding passes disagreed are left out of that theme's denominator. Statements can raise several themes. Below ${MIN_N} statements, counts are shown instead of percentages. Hover a theme to see the codes it groups.</div></section><section class="panel"><h3>What else do these countries discuss?</h3><p class="muted">Among statements raising <strong>${esc(cond)}</strong> (${base.length}), select a second theme.</p>${D.themes.filter(t=>t!==cond).map(t=>{const s=themeShare(base,t),o=themeShare(a,t);return themeBar(t,s.k,s.d,'data-pair',state.pair===t,`<div class="muted" style="text-align:right">Overall: ${rate(o.k,o.d)}</div>`)}).join('')}<p class="muted">Same annual statement; not necessarily an explicit connection between issues.</p></section><section class="panel"><h3>Emphasis across years</h3><div class="tablewrap"><table class="heat"><thead><tr><th>Theme</th>${D.years.map(y=>`<th>${y}</th>`).join('')}</tr></thead><tbody>${D.themes.map(t=>`<tr><th>${esc(t)}</th>${D.years.map(y=>{const s=themeShare(stats(y).ai,t),p=s.d?s.k/s.d:0;return `<td><button data-heatyear="${y}" data-heattheme="${esc(t)}" aria-label="${esc(t)}, ${y}: ${s.k} of ${s.d}" style="background:color-mix(in srgb,var(--blue) ${Math.round(p*45)}%,var(--surface))">${s.d<MIN_N?`${s.k}/${s.d}`:pct(s.k,s.d)}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="muted">Common taxonomy across years. Cells with fewer than ${MIN_N} statements show counts (k/n). Click a cell to list its countries.</div></section>`;}

function quoteBlock(e){const q=D.quotes[e];return q?`<div class="quote">${esc(q.q)}<span class="muted">${esc(e)}${q.at?' · '+esc(q.at):''}</span></div>`:'';}
function unView(){const ps=pos(),m=state.mechanism,ms=models(),vs=venues(),rq=reqs();
const tiles=['Dialogue','Panel','Fund','Models'].map(k=>`<button data-mechanism="${k}" aria-pressed="${m===k}"><span>${TILE[k]}<br><span class="muted">${k==='Models'?'countries proposing':'countries supporting'}</span></span><strong>${k==='Models'?mechCountries('Models').size:supporters(k).size}</strong></button>`).join('');
const shown=ps.filter(p=>p.p!=='Excluded'&&(!m||p.m===m)),excluded=ps.filter(p=>p.p==='Excluded'&&(!m||p.m===m));
const posTable=m==='Models'?'':`<section class="panel"><h3>${m?esc(MECH[m]):'Positions on UN AI mechanisms'}</h3><div class="tablewrap"><table><thead><tr><th>Country / mechanism</th><th>Position</th><th>Basis</th></tr></thead><tbody>${shown.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button><div class="muted">${TILE[p.m]}</div></td><td><span class="tag${p.p==='Support'?'':' neutral'}">${p.p}</span>${p.k?'<span class="tag">Commitment</span>':''}</td><td>${esc(p.n)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')||`<tr><td colspan="3" class="empty">No references to ${m?esc(MECH[m]):'these mechanisms'} in this selection.</td></tr>`}</tbody></table></div>${excluded.length?`<details><summary>${excluded.length} reference${excluded.length===1?'':'s'} not counted</summary><table><tbody>${excluded.map(p=>`<tr><td>${esc(cname(p.c))}<div class="muted">${TILE[p.m]} · ${p.e}</div></td><td>${esc(p.n)}</td></tr>`).join('')}</tbody></table></details>`:''}</section>`;
const modelTable=(!m||m==='Models')?`<section class="panel"><h3>Institutional models proposed</h3><div class="tablewrap"><table><thead><tr><th>Country</th><th>Model</th><th>Proposal</th></tr></thead><tbody>${ms.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td><span class="tag neutral">${esc(p.cat)}</span></td><td>${esc(p.p)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')||'<tr><td colspan="3" class="empty">No institutional models proposed in this selection.</td></tr>'}</tbody></table></div>${vs.length?`<h3 style="margin-top:16px">Venues outside the UN</h3><div class="tablewrap"><table><tbody>${vs.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td>${esc(p.v)}<details><summary>Statement</summary>${quoteBlock(p.e)}</details></td></tr>`).join('')}</tbody></table></div>`:''}</section>`:'';
const reqTable=!m?`<section class="panel"><h3>Requests to the UN</h3><div class="tablewrap"><table><thead><tr><th>Country</th><th>What is asked</th></tr></thead><tbody>${rq.map(p=>`<tr><td><button class="link" data-country="${p.c}">${esc(cname(p.c))}</button></td><td>${p.f.map(f=>`<span class="tag neutral">${esc(f)}</span>`).join('')}${quoteBlock(p.e)}</td></tr>`).join('')||'<tr><td colspan="2" class="empty">No explicit requests to the UN in this selection.</td></tr>'}</tbody></table></div></section>`:'';
return `<h2>What role is proposed for the UN?</h2><div class="muted">Explicit references and positions · ${state.year} · ${esc(state.group)}</div><section class="panel"><div class="tilegrid">${tiles}</div><p class="muted">A supporter names or clearly refers to the specific UN mechanism and supports, welcomes or commits to it. A mention is not an endorsement, and general capacity-building calls are not Fund support.</p></section>${posTable}${modelTable}${reqTable}`;}

function implications(){let last=null;return `<h2>From evidence to action</h2><div class="muted">Analyst recommendations · Fixed scope: ${LAST}, all groups</div><section class="panel"><p class="muted">These recommendations do not change with the filters. Each links to the view holding its supporting statements.</p>${D.implications.map((v,i)=>{const head=v.addressee!==last?`<div class="eyebrow addressee">${esc(v.addressee)}</div>`:'';last=v.addressee;return `${head}<article class="recommend"><h3>${esc(v.title)}</h3><p>${esc(v.text)}</p><button class="link" data-evidence="${i}">Supporting statements →</button></article>`}).join('')}</section>`;}

function matching(){return scoped().filter(x=>(state.show==='all'||x.r?.ai)&&(!state.theme||has(x,state.theme))&&(!state.pair||has(x,state.pair))&&(!state.mechanism||mechCountries(state.mechanism).has(x.c)));}
function list(){const a=matching(),rq=new Set(reqs().map(p=>p.c));$('#ux-listcontext').textContent=`${state.year} · ${state.group} · Select a country for its statement details`;
$('#ux-activefilter').innerHTML=[state.theme,state.pair,state.mechanism&&TILE[state.mechanism]].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+((state.theme||state.mechanism)?'<button class="link" data-clearfilters>Clear topic filters</button>':'');
$('#ux-countryrows').innerHTML=a.map(x=>{const ts=x.r?.ai?D.themes.filter((t,i)=>x.r.t[i]===1):[];return `<tr class="${x.c===state.country?'selected':''}"><td><button class="link" data-country="${x.c}" aria-pressed="${x.c===state.country}">${esc(cname(x.c))}</button></td><td>${!x.r?'Unavailable':x.r.ai?'Yes':'No'}</td><td>${ts.length?ts.slice(0,2).map(t=>`<span class="tag">${esc(t)}</span>`).join('')+(ts.length>2?`<span class="muted">+${ts.length-2}</span>`:''):'—'}</td><td>${!x.r?'—':rq.has(x.c)?'Yes':'None'}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">No countries match this selection. Clear topic filters or choose another year.</td></tr>';
$('#ux-liststatus').textContent=`${a.length} countr${a.length===1?'y':'ies'} shown`;}

function detail(){const c=state.country;if(!c){$('#ux-detail').innerHTML='<div class="eyebrow">Statement details</div><h2>Select a country</h2><p class="muted">Choose a country from any section to see its themes, institutional positions and source evidence here.</p>';return;}
const r=byYear[state.year]?.[c],m=r&&D.meta[r.id],ev=(r&&D.evidence[r.id])||[],y=state.year;
const my=(arr)=>arr.filter(p=>p.y===y&&p.c===c);
const ts=r?.ai?D.themes.filter((t,i)=>r.t[i]===1):[],open=r?.ai?D.themes.filter((t,i)=>r.t[i]===null):[];
const speaker=m?[m.speaker,m.title].filter(Boolean).join(', ')+(m.date?` · ${m.date}`:''):'';
const inst=[...my(D.positions).map(p=>`<details><summary>${TILE[p.m]} · ${p.p==='Excluded'?'not counted':p.p}${p.k?' + Commitment':''}</summary><p>${esc(p.n)}</p>${quoteBlock(p.e)}</details>`),...my(D.models).map(p=>`<details><summary>Institutional model · ${esc(p.cat)}</summary><p>${esc(p.p)}</p>${quoteBlock(p.e)}</details>`),...my(D.venues).map(p=>`<details><summary>Venue outside the UN · ${esc(p.v)}</summary>${quoteBlock(p.e)}</details>`)];
$('#ux-detail').innerHTML=`<div class="rowhead"><div class="eyebrow">Statement details</div><button class="link" data-close aria-label="Close country details">Close</button></div><h2>${esc(cname(c))}</h2><div class="muted">${esc(D.countries[c].group)} · ${y}</div>
<section><h3>AI statement summary</h3><p>${!r?'No statement was obtained for this year.':r.ai?`Refers to AI in ${ev.length} coded passage${ev.length===1?'':'s'}.`:'No reference to AI found in this statement.'}</p>${speaker?`<div class="muted">${esc(speaker)}</div>`:''}${m?.override?`<div class="note">Status settled for the dashboard: ${esc(m.override)}</div>`:''}</section>
<section><h3>Themes</h3>${ts.map(t=>`<span class="tag">${esc(t)}</span>`).join('')||`<p class="muted">${r?.ai?'No theme confirmed.':'—'}</p>`}${open.length?`<p class="muted">Coding not settled: ${open.map(esc).join(', ')}.</p>`:''}${ev.length?`<details><summary>View AI passages (${ev.length})</summary>${ev.map(e=>`<div class="quote">${esc(e.q)}<span class="muted">${e.th.length?esc(e.th.join('; '))+' · ':''}${esc(e.at)}</span></div>`).join('')}</details>`:''}</section>
<section><h3>Requests to the UN</h3>${my(D.requests).map(p=>`<p>${p.f.map(f=>`<span class="tag neutral">${esc(f)}</span>`).join('')}</p>${quoteBlock(p.e)}`).join('')||`<p class="muted">${r?'No explicit request to the UN.':'—'}</p>`}</section>
<section><h3>Institutional positions</h3>${inst.join('')||`<p class="muted">${r?'No references to UN mechanisms or institutional models.':'—'}</p>`}</section>
<section><h3>Source statement</h3>${m?`<p class="muted">${esc(m.type)}${m.record?` · ${esc(m.record)}`:''}</p><p>${m.url?`<a href="${esc(m.url)}" target="_blank" rel="noopener">${m.record?'Official record':'Transcript'}</a>`:''}${m.audio?` · <a href="${esc(m.audio)}" target="_blank" rel="noopener">UN Web TV</a>`:''}</p>`:'<p class="muted">No source statement for this year.</p>'}</section>
<section><h3>This country across years</h3><div class="history">${D.years.map(yy=>{const q=byYear[yy]?.[c];return `<button data-countryyear="${yy}" aria-pressed="${yy===y}" aria-label="${yy}, ${!q?'unavailable':q.ai?'AI referenced':'no AI reference'}">${String(yy).slice(2)} ${!q?'?':q.ai?'●':'–'}</button>`}).join('')}</div><p class="muted">● AI reference · – No reference · ? Unavailable</p></section>`;}

function render(){const a=matching();if(state.country&&!a.some(x=>x.c===state.country)&&!scoped().some(x=>x.c===state.country))state.country=a[0]?.c??null;$('#ux-year').value=state.year;$('#ux-group').value=state.group;$('#ux-show').value=state.show;$('#ux-scope').textContent=`${state.year} / ${state.group}`;root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===state.tab));$('#ux-view').innerHTML=({facts,themes:themesView,un:unView,implications})[state.tab]();$('#ux-countries').hidden=state.tab==='implications';list();detail();}

$('#ux-run').innerHTML=`Analysis run ${esc(D.run)}<br>${D.years[0]}–${LAST}`;
$('#ux-method').innerHTML=`<p>General Debate only: one principal statement per Member State per year. Year totals count statements obtained; Member States without an obtained statement are listed as unavailable and left out of rates. Regional groups follow the UN's five groups; the United States, which belongs to no group, is counted with Western European and other States.</p><p><strong>AI references.</strong> Statements where the keyword search found no AI term are counted as No (${D.pendingToNo} statements). Statements with a keyword hit were read in full. Seven statements the review left undecided were settled for this dashboard: three that name artificial intelligence in a list count as Yes; four that only mention machines, robots or algorithms count as No.</p><p><strong>Themes.</strong> The 26 codes of the analysis taxonomy are grouped into ${D.themes.length} themes. A theme is counted when any of its codes applies. When the two independent coding passes disagreed and no code applies, the theme is left blank and out of the denominator.</p><p><strong>Role of UN.</strong> Each reference to the Global Dialogue, the Scientific Panel or the proposed Fund was checked against its full quote. Only statements that name or clearly refer to the mechanism and support, welcome or commit to it count as support; mentions, requests, reservations and commitments are kept distinct. References that are not to the UN mechanism are listed as not counted. Institutional models and venues outside the UN are a curated list with source quotes.</p><p><strong>Sources.</strong> 2017–2024: official verbatim records (PDF page and paragraph). 2025–2026: automatic transcripts (unofficial), located by time in the UN Web TV recording.</p>`;
$('#ux-year').innerHTML=[...D.years].reverse().map(y=>`<option value="${y}">${y} · UNGA${y-1945}</option>`).join('');$('#ux-group').innerHTML=[ALL,...D.groups].map(g=>`<option>${esc(g)}</option>`).join('');
$('#ux-year').addEventListener('change',e=>{state.year=Number(e.target.value);render()});$('#ux-group').addEventListener('change',e=>{state.group=e.target.value;state.country=null;render()});$('#ux-show').addEventListener('change',e=>{state.show=e.target.value;render()});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.tab){state.tab=d.tab;state.theme=null;state.pair=null;state.mechanism=null;}
else if(d.group){state.group=d.group;state.country=null;}
else if('resetgroup'in d){state.group=ALL;}
else if(d.year){state.year=+d.year;}
else if(d.country){state.country=d.country;if(!matching().some(x=>x.c===d.country))state.show='all';render();if(root.clientWidth<680)$('#ux-detail').scrollIntoView({block:'start',behavior:'auto'});return;}
else if('close'in d){state.country=null;detail();return;}
else if(d.theme){state.theme=state.theme===d.theme?null:d.theme;state.pair=null;}
else if(d.pair){state.theme=state.theme||D.themes[0];state.pair=state.pair===d.pair?null:d.pair;}
else if(d.mechanism){state.mechanism=state.mechanism===d.mechanism?null:d.mechanism;}
else if('clearfilters'in d){state.theme=null;state.pair=null;state.mechanism=null;}
else if(d.heatyear){state.year=+d.heatyear;state.theme=d.heattheme;state.pair=null;}
else if(d.countryyear){state.year=+d.countryyear;state.show='all';state.theme=null;state.pair=null;state.mechanism=null;}
else if('evidence'in d){const l=D.implications[+d.evidence].link;state.tab=l.tab;state.year=LAST;state.group=ALL;state.theme=l.theme??null;state.pair=null;state.mechanism=l.mechanism??null;}
else return;render();});
state.country=stats().ai[0]?.c??null;render();
})();
</script>
</body>
</html>
